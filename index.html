 ["Research until I understand it properly.",["Mastery","Analytical"],"A"],
 ["Find the right people to ask.",["Collaboration"],"C"],
 ["Sketch what this could become.",["Innovation","SystemsThinking"],"V"]]},
{k:'duo',t:"Picture two good days at work.",ask:"Which one is better?",o:[
 ["Solving something hard, mostly on my own.",["Autonomy","Mastery"]],
 ["Working through something with good people.",["Collaboration","Belonging"]]]},

 ["Look for the opportunity in it.",["Innovation","Autonomy"]]]},
{k:'duo',t:"A decision with real trade-offs.",ask:"Which sounds more like you?",o:[
 ["Take the safe route we know works.",["Security","Structure"]],
 ["Take the bigger bet with the bigger payoff.",["RiskTaking","Impact"]]]},
{k:'sit',t:"Month-end is a week away. The numbers still don't match and people are tense.",ask:"What do you do?",o:[
 ["Make a clear list of who does what.",["Structure","Achievement"],"E"],
 ["Find the real cause of the mismatch.",["Mastery","Analytical"],"A"],
 ["Get both sides on the same page.",["Collaboration","Belonging"],"C"],
 ["Step back and look at the bigger picture.",["SystemsThinking","Impact"],"V"]]},
{k:'duo',t:"One more about your environment.",ask:"Which sounds more like you?",o:[
 ["I like fast-moving, new challenges.",["EnvDynamic","Growth"]],
 ["I like working closely with people.",["EnvCollaborative","Collaboration"]]]},
{k:'sit',t:"Announcement: the whole company will move to one new system next year.",ask:"What do you want to know first?",o:[
 ["What changes, and what I do differently.",["Structure","Achievement"],"E"],
 ["What new possibilities it opens.",["Innovation","Autonomy"],"V"],
 ["Why we're changing, and what the data says.",["Purpose","Analytical"],"A"],
 ["How everyone moves together.",["Collaboration","Influence"],"C"]]},
{k:'top3',t:"Imagine you could pick the work that fills your next year.",ask:"Which three would you jump at?",o:[
 ["Be the go-to person when something technical breaks.",["CarSpecialist","PathTechSpecialist"]],
 ["Teach colleagues how to do something well.",["CarSpecialist","PathCoachSME"]],
 ["Look after a small team's day to day.",["CarPeopleLeader","PathTeamLead"]],
 ["Run a project from kickoff to handover.",["CarPeopleLeader","PathProgrammeLead"]],
 ["Link two departments that don't understand each other.",["CarCrossFunctional","PathBizPartner"]],
 ["Use numbers to help decide what we do next.",["CarCrossFunctional","PathStrategist"]],
 ["Automate a tedious process so it runs itself.",["CarBuilder","PathDigitalBuilder"]],
 ["Help a department adjust to a new way of working.",["CarBuilder","PathChangeLead"]]]},
{k:'top3',t:"Last card. Think about what makes work worth it for you.",ask:"Which three matter most?",o:[
 ["Knowing my work makes a real difference.",["Purpose"]],
 ["Feeling stable and secure in my role.",["Security"]],
 ["Being part of a team I trust.",["Belonging"]],
 ["Having a say in where things go.",["Influence"]],
 ["Building something that lasts after I move on.",["LastingValue"]],
 ["Things done properly, fairly and by the book.",["Governance"]],
 ["Getting to the truth of a hard problem.",["Analytical"]],
 ["Seeing separate pieces come together.",["Integration"]]]}
];
const ASPIRE = {t:"Almost done. Two last questions, about the real you.",
 ask:"In your actual job, which areas would you most like to build over the next 12 months? Pick up to two."};
const SUPPORT = {mentor:"A mentor or someone who's done it before",
 project:"A stretch project or assignment",
 training:"Formal training or a certification",
 clarity:"Clarity on what my next steps could be"};

const DRIVER_PHRASE = {Structure:"clear structure and expectations",Achievement:"getting things done and delivering",
 Innovation:"finding smarter or better ways to work",Mastery:"going deep and building real expertise",
 Collaboration:"working closely with people",Autonomy:"having ownership over how you work",Impact:"seeing tangible, meaningful impact",
 Recognition:"being noticed for what you contribute",Belonging:"being part of a team that has your back",
 Growth:"stretching yourself and learning fast",Security:"stability and knowing where you stand",
 Analytical:"understanding the why before acting",Efficiency:"removing friction and waste",Purpose:"work that genuinely matters",
 Influence:"shaping outcomes and being heard",RiskTaking:"taking bold, uncertain bets",
 SystemsThinking:"seeing the bigger, connected picture",Adaptability:"adjusting quickly when things shift",
 LastingValue:"building something that outlasts you",Integration:"connecting different people and pieces together",
 Governance:"keeping things accountable and well-run"};
const LABEL = {Structure:"Structure",Achievement:"Achievement",Innovation:"Innovation",Mastery:"Mastery",Collaboration:"Collaboration",
 Autonomy:"Autonomy",Impact:"Impact",Recognition:"Recognition",Belonging:"Belonging",Growth:"Growth",Security:"Security",
 Analytical:"Analytical Depth",Efficiency:"Efficiency",Purpose:"Purpose",Influence:"Influence",RiskTaking:"Risk-Taking",
 SystemsThinking:"Systems Thinking",Adaptability:"Adaptability",LastingValue:"Lasting Value",Integration:"Integration",Governance:"Governance"};
const ENERGISE_TAGS = ["Achievement","Mastery","Impact","Innovation","Collaboration","Recognition","Autonomy","Growth","SystemsThinking","RiskTaking","Efficiency","Adaptability"];
const WHY_TAGS = ["Purpose","Security","Belonging","Influence","LastingValue","Governance","Analytical","Integration"];

const CAR = {CarSpecialist:{lbl:"The Expert",d:"You lean toward becoming a deep specialist — the person others bring hard problems to.",
   dev:"Advanced technical/functional capability, certifications, expert pathways, knowledge-sharing."},
 CarPeopleLeader:{lbl:"The Leader",d:"You lean toward people leadership — helping others grow while shaping direction.",
   dev:"People leadership, coaching, facilitation, communication development."},
 CarCrossFunctional:{lbl:"The Connector",d:"You lean toward cross-functional, business-wide problem-solving.",
   dev:"Business problem-solving, process improvement, cross-functional projects, strategic thinking."},
 CarBuilder:{lbl:"The Builder",d:"You lean toward building and transforming — turning ideas into reality.",
   dev:"Digital/AI capability, automation, innovation projects, experimentation & POCs."}};
const LEARN = {LearnStructured:"You learn best with a clear, sequential guide.",
 LearnExperiential:"You learn best by doing — a real problem beats a manual.",
 LearnSocial:"You learn best through people — coaching, mentoring, discussion.",
 LearnSelfDirected:"You learn best exploring independently, at your own pace."};
const ENV = {EnvStructured:"clear structure and defined expectations.",EnvAutonomous:"freedom and trust to decide how you work.",
 EnvDynamic:"fast-moving, challenging, ever-changing work.",EnvCollaborative:"close, people-centred teamwork."};
// ---- Growth directions: two under each career pull. "route" says how this can actually happen at Aafiyat ----
// Aafiyat has three levels only (Executive, HOS, HOD) and no separate specialist or cross-department titles,
// so most directions are described as assignments, not jobs. L&D to adjust "route" as the structure evolves.
const PATHS = {
 PathTechSpecialist:{parent:"CarSpecialist",lbl:"Technical / Functional Specialist",theme:"Deeper technical or functional expertise",styles:['A','E'],
  d:"You'd grow as the person with real depth, the one others check with before they decide.",
  route:"There is no separate specialist title today (Executive, HOS, HOD). This grows by staying and deepening in your function, taking on harder assignments, and becoming the recognised go-to person.",
  dev:["Advanced technical or functional certification in your area","A deep-dive on one process or system until you're the go-to reference","Documentation and knowledge-sharing skills, so your expertise travels","Data analysis and troubleshooting depth"],
  stretch:"Own one system or process end to end, and write the reference guide that others will use."},
 PathCoachSME:{parent:"CarSpecialist",lbl:"Coach & Capability Builder",theme:"Coaching and training others",styles:['C','V'],
  d:"You'd grow by turning what you know into other people's skill.",
  route:"Mostly through assignments: internal trainer or mentor for new joiners and colleagues, working alongside L&D.",
  dev:["Facilitation and training delivery","Coaching conversations (for example the GROW model) and giving feedback","Learning design basics: turning a process into a short, usable session","Presentation and communication skills"],
  stretch:"Run one short internal session on something you know well, then collect feedback and improve it."},
 PathTeamLead:{parent:"CarPeopleLeader",lbl:"People Leader (HOS / HOD track)",theme:"Leading people",styles:['C','V'],
  d:"You'd grow by taking responsibility for people and how they perform.",
  route:"This is the formal route: Executive, then Head of Section (HOS), then Head of Department (HOD). Leading a small crew or project first is a good way to test it.",
  dev:["First-time leader programme","Delegation and setting clear expectations","Performance and feedback conversations","Handling conflict and building team trust"],
  stretch:"Lead a small team or project crew for a set period, with a mentor to debrief with."},
 PathProgrammeLead:{parent:"CarPeopleLeader",lbl:"Project & Delivery Lead",theme:"Running projects from plan to delivery",styles:['E','A'],
  d:"You'd grow by taking a goal from plan to done, across people and deadlines.",
  route:"Mostly through assignments: leading cross-team projects and rollouts alongside your normal role. It is also a good proving ground for the HOS track.",
  dev:["Project management fundamentals: planning, scheduling and risk","Tracking budget, resources and progress reporting","Stakeholder updates and expectation-setting","Negotiating priorities under deadline pressure"],
  stretch:"Plan and run a cross-department project with a real deadline, and report progress to management."},
 PathBizPartner:{parent:"CarCrossFunctional",lbl:"Cross-department Partner",theme:"Working across departments",styles:['C','E'],
  d:"You'd grow as the person who connects departments, someone who understands each side and gets them working together.",
  route:"There is no dedicated role for this today. It grows through cross-department projects, working groups and process-owner assignments. The closest formal seat is Process & Digitalization Executive, but seats are very few.",
  dev:["Stakeholder management and influencing without authority","Business acumen: how other departments really work","Gathering requirements and translating needs between teams","Presenting and negotiating with senior people"],
  stretch:"Be the named point of contact between two departments on one live project."},
 PathStrategist:{parent:"CarCrossFunctional",lbl:"Strategist & Planner",theme:"Planning, analysis and strategy",styles:['A','V'],
  d:"You'd grow by helping decide where the business goes next, using data and the bigger picture.",
  route:"Mostly through assignments: business-plan and performance work, analysis, and preparing recommendations for HOS, HOD and management.",
  dev:["Strategic thinking and scenario planning","KPI design and business analysis","Data storytelling: turning numbers into a recommendation","Decision-making frameworks and presenting to management"],
  stretch:"Write a short recommendation paper for management on a real question, backed by data."},
 PathDigitalBuilder:{parent:"CarBuilder",lbl:"Digital & Automation Builder",theme:"Digital, automation and AI skills",styles:['E','A'],
  d:"You'd grow by building better tools and systems: automating work and making new things possible.",
  route:"The closest formal seat is Process & Digitalization Executive, but seats are very few. More widely, it happens through automation and AI champion assignments in your own function.",
  dev:["Process automation and low-code tools","Data and AI literacy, including practical AI tools at work","Systems analysis: how business processes map onto systems","Running small experiments and proofs of concept"],
  stretch:"Automate one repetitive task end to end, and measure the time it saves."},
 PathChangeLead:{parent:"CarBuilder",lbl:"Change & Improvement Lead",theme:"Improving processes and leading change",styles:['V','C'],
  d:"You'd grow by helping people and teams adopt better ways of working.",

};
const METHOD = {LearnStructured:"A structured pathway suits you best: a clear programme or certification with defined stages and milestones.",
 LearnExperiential:"Learning by doing suits you best: a stretch assignment or live project, with a short debrief afterwards.",
 LearnSocial:"Learning through people suits you best: a mentor, shadowing someone already in the role, and regular conversations.",
 LearnSelfDirected:"Self-paced learning suits you best: good resources and room to explore, with an occasional check-in."};
const EDGE = {V:"Pair big ideas with clear milestones and a follow-through partner, so good ideas actually land.",
 E:"Before moving, check the assumptions and the data. A short pause can save a rework.",
 A:"Practise deciding with about 70% of the information, and keep the explanation simple for people who just need the answer.",

function pickPath(carKey){
  const kids = Object.keys(PATHS).filter(k=>PATHS[k].parent===carKey);
  const na = tally[kids[0]]||0, nb = tally[kids[1]]||0;
  if(na!==nb) return na>nb ? kids[0] : kids[1];
  const style = thinkScores()[0].k;
  return PATHS[kids[0]].styles.includes(style) ? kids[0] : kids[1];
}
const SPECTRA = [
 {label:["Structured","Autonomous"], l:"Structure", r:"Autonomy"},
 {label:["Independent","Collaborative"], l:"Autonomy", r:"Collaboration"},
 {label:["Detail-focused","Big-picture"], l:"Analytical", r:"SystemsThinking"},
 {label:["Execution","Exploration"], l:"Achievement", r:"Innovation"},
 {label:["Stability","Ambiguity"], l:"Security", r:"RiskTaking"},
 {label:["Task-focused","People-focused"], l:"Achievement", r:"Collaboration"},
];

// ---- Thinking style (Visionary / Executor / Analyst / Connector) ----
// Applied only to decision-style scenes where each style has a natural option.
// Options carry a style letter (V/E/A/C) as their third element.
const THINK = {
 V:{tag:"ThinkVisionary",lbl:"Visionary",d:"You tend to start with the bigger picture — where this could go and what could be done differently — before settling the details."},
 E:{tag:"ThinkExecutor",lbl:"Executor",d:"You tend to think by doing — turning plans into progress quickly, and settling once there's something concrete moving."},
 A:{tag:"ThinkAnalyst",lbl:"Analyst",d:"You tend to think by understanding — looking for the evidence and root cause before you commit to a direction."},
 C:{tag:"ThinkConnector",lbl:"Connector",d:"You tend to think through people — reading the room, aligning perspectives and bringing others in to reach the best answer."}
};
const THINK_AVAIL = {};
Object.keys(THINK).forEach(k=>THINK_AVAIL[THINK[k].tag]=0);
Q.forEach(q=>q.o.forEach(o=>{ if(typeof o[2]==='string'){ const t=THINK[o[2]].tag; o[1].push(t); THINK_AVAIL[t]++; } }));
function thinkScores(){
  return Object.keys(THINK).map(k=>{
    const t = THINK[k].tag, av = THINK_AVAIL[t]||1, n = tally[t]||0;
    return {k, lbl:THINK[k].lbl, n, av, pct:Math.round(n/av*100)};
  }).sort((a,b)=> b.pct-a.pct || b.n-a.n);
}

let flat = Q.slice();
let idx=0, tally={}, statedThemes=[], supportKey=null, stage=document.getElementById('stage'), lastChapterShown=0, playerName="";
let chapterLog={}, history=[], usedBack=new Set();

function bump(tags){ tags.forEach(t=>tally[t]=(tally[t]||0)+1); }
function unbump(tags){ tags.forEach(t=>{ if(tally[t]) tally[t]--; }); }
function pickTop(keys){ let best=null,n=-1; keys.forEach(k=>{ if((tally[k]||0)>n){n=tally[k]||0;best=k;} }); return best; }
function spectrum(l,r){ const L=tally[l]||0,R=tally[r]||0; if(L+R===0) return 50; return Math.round(R/(L+R)*100); }
function nm(s){ s = s||'';
  if(playerName && playerName!=='you') return s.split('{{NAME}}').join(playerName);
  return s.replace(/,\s*\{\{NAME\}\}/g,'').replace(/\{\{NAME\}\},\s*/g,'').split('{{NAME}}').join('you'); }

function renderIntro(){
  const head = `<div class="ask" style="font-size:22px;margin-bottom:8px;color:var(--accent);font-family:Georgia,serif;">YOUR NEXT CHAPTER</div>`;
  if(mode==='invalid'){
    stage.innerHTML = `<div class="scene" style="text-align:center">${head}<div class="narr">${esc(batchName)}</div></div>`; return;
  }
  const blurb = `<div class="narr" style="font-size:13px;font-style:normal;color:var(--sub);font-family:Arial,sans-serif;margin-bottom:18px;">${flat.length} quick cards, about 4 minutes.<br>No right or wrong answers. Just pick what feels most like you.</div>`;
  if(mode==='server'){
    stage.innerHTML = `<div class="scene" style="text-align:center">${head}
      ${batchName && BATCH!=='general' ? `<div class="eyebrow">${esc(batchName)}</div>` : ''}
      <div class="narr" style="margin-bottom:8px;">A few quick questions about how you work, think and grow.</div>${blurb}
      <label class="flabel" for="fName">Name</label><input class="field" id="fName" maxlength="100" autocomplete="name">
      <label class="flabel" for="fCompany">Company</label><select class="field" id="fCompany" onchange="document.getElementById('fCompanyOtherWrap').style.display=this.value==='Others'?'block':'none'"><option value="">Select</option>${COMPANIES.map(c=>`<option>${c}</option>`).join('')}</select>
      <div id="fCompanyOtherWrap" style="display:none"><input class="field" id="fCompanyOther" maxlength="100" placeholder="Company name"></div>
      <label class="flabel" for="fDept">Department</label><input class="field" id="fDept" list="deptList" maxlength="120" placeholder="Start typing to search"><datalist id="deptList">${DEPARTMENTS.map(d=>`<option value="${esc(d)}">`).join('')}</datalist>
      <label class="flabel" for="fRole">Role</label><select class="field" id="fRole"><option value="">Select</option>${ROLES.map(c=>`<option>${c}</option>`).join('')}</select>
      <div class="ferr" id="fErr" role="alert"></div>
      <div class="note" style="text-align:left;margin:0 0 14px;font-family:Arial,sans-serif;">Your answers are saved for development conversations. They are not used for performance evaluation.</div>
      <button class="cbtn" style="width:100%" onclick="startStory()">START →</button></div>`;
    document.getElementById('fName').focus();
    return;
  }
  stage.innerHTML = `<div class="scene" style="text-align:center">${head}
    <div class="narr" style="margin-bottom:10px;">A few quick questions about how you work, think and grow.</div>${blurb}
    <input type="text" id="nameInput" class="nameinput" placeholder="What should we call you?" maxlength="24">
    <button class="cbtn" style="width:100%" onclick="startStory()">START →</button></div>`;
  document.getElementById('nameInput').focus();
}
function startStory(){
  if(mode==='server'){
    const v = id=>(document.getElementById(id).value||'').trim();
    const company = v('fCompany')==='Others' ? v('fCompanyOther') : v('fCompany');
    let err = '';
    if(!v('fName')) err='Please enter your name.';
    else if(!v('fCompany')) err='Please choose your company.';
    else if(v('fCompany')==='Others' && !v('fCompanyOther')) err='Please enter your company name.';
    else if(!v('fDept')) err='Please enter your department.';
    else if(!v('fRole')) err='Please choose your role.';
    if(err){ document.getElementById('fErr').textContent = err; return; }
    participant = {name:v('fName'), company:company, department:v('fDept'), role:v('fRole')};
    playerName = participant.name;
  } else {
    const val = (document.getElementById('nameInput').value || '').trim();
    playerName = val || 'you'; participant = {name:playerName};
  }
  submissionId = uuid();
  render();
}
let busy=false, picks=[];
const DEPARTMENTS = ["ACCOUNT", "BUSINESS PLANNING & PERFORMANCE", "CORPORATE AFFAIRS & STAKEHOLDER ENGAGEMENT (CASE)", "DIGITAL SALES (ADMIN)", "DIGITAL SALES (AFFILIATE)", "DIGITAL SALES (BUSINESS DEVELOPMENT)", "DIGITAL SALES (COMMERCIAL SALES)", "DIGITAL SALES (MARKETING & CREATIVE)", "DIGITAL SALES (TECH & SYSTEM INTEGRATION)", "DIGITAL SALES 1 (DS1)", "DIGITAL SALES 2 (DS2)", "DIGITAL SALES 3 (DS3)", "FINANCE", "HUMAN CAPITAL (OPERATIONS & CULTURE ADOPTION)", "LEGAL", "OLIVE HUB INNOVATION, PRODUCT & QUALITY EXCELLENCE", "OPERATIONAL SUPPORT & INFRASTRUCTURE", "PERFORMANCE & CUSTOMER MANAGEMENT", "PLANNING & PROCUREMENT", "PRODUCT COORDINATION & STRATEGIC SUPPORT", "SALES", "SALES CHANNEL - AGENT SALES", "STORE BUSINESS MANAGEMENT (B2B)", "SUPPLY CHAIN - FULFILMENT", "SUPPLY CHAIN - PRODUCTION", "SUPPLY CHAIN - QUALITY CONTROL", "SUPPLY CHAIN - WAREHOUSE & LOGISTIC", "TRANSFORMATION - PEOPLE STRATEGY", "TRANSFORMATION - TECHNOLOGY ENABLEMENT"];
const COMPANIES = ["AMSB","ADSB","Others"], ROLES = ["Top Management","HOD","HOS","Executive","Other"];
const BATCH = (new URLSearchParams(location.search).get('batch')||'general').slice(0,80);
let mode = 'offline', batchName = '', participant = {}, submissionId = '', lastSummary = null, saveState = '';
function uuid(){ try{ return crypto.randomUUID(); }catch(e){ return 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); } }
function browserId(){ let b=uuid(); try{ b=localStorage.getItem('ync-browser')||b; localStorage.setItem('ync-browser',b); }catch(e){} return b; }
const esc = t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function initMode(){
  try{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 4000);
    const r = await fetch('/api/batch-info?batch='+encodeURIComponent(BATCH), {signal:ctl.signal}); clearTimeout(to);
    const ct = r.headers.get('content-type')||'';
    if(!ct.includes('json')) throw new Error('no server');
    const d = await r.json();
    if(r.ok){ mode='server'; batchName = d.name||''; }
    else { mode='invalid'; batchName = d.error||'This link could not be opened.'; }
  }catch(e){ mode='offline'; }
  renderIntro();
}
const KIND = {sit:'Situation', duo:'This or that', top3:'Pick three'};
function render(){ busy=false; picks=[]; renderScene(flat[idx]); }
function progress(){
  let d=''; for(let i=0;i<flat.length;i++) d+=`<div class="dot2 ${i<idx?'done':''}"></div>`;
  return `<div class="dots">${d}</div><div class="count">${idx+1} / ${flat.length}</div>`;
}
function renderScene(q){
  const letters=['A','B','C','D'];
  const canBack = history.length>0 && !usedBack.has(history[history.length-1].idx);
  let body='';
  if(q.k==='sit') body = q.o.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${letters[i]}.</b>${o[0]}</button>`).join('');
  else if(q.k==='duo') body = `<button class="opt" onclick="choose(0)">${q.o[0][0]}</button><div class="or">or</div><button class="opt" onclick="choose(1)">${q.o[1][0]}</button>`;
  else body = q.o.map((o,i)=>`<button class="opt pk" data-i="${i}" onclick="togglePick(${i})"><b>•</b>${o[0]}</button>`).join('')
    + `<div class="pkcount" id="pkCount">0 of 3 picked</div><button class="cbtn" id="pkGo" style="width:100%;opacity:.4" onclick="confirmPicks()">Continue →</button>`;
  stage.innerHTML = `<div class="scene">${progress()}
    ${canBack ? `<button class="backbtn" onclick="goBack()">← Change my last answer</button>` : ''}
    <div class="chip">${KIND[q.k]}</div><div class="narr">${nm(q.t)}</div><div class="ask">${nm(q.ask)}</div>${body}</div>`;
}
function advance(){ idx++; if(idx>=flat.length) renderAspiration(); else render(); }
function choose(i){
  if(busy) return; busy=true;
  const opt = flat[idx].o[i];
  bump(opt[1]); history.push({idx:idx, tags:opt[1].slice(), sel:[i]});
  const el = stage.querySelectorAll('.opt')[i]; if(el) el.classList.add('sel');
  setTimeout(advance, 260);
}
function togglePick(i){
  if(busy) return;
  if(picks.includes(i)) picks = picks.filter(x=>x!==i);
  else { picks.push(i); if(picks.length>3) picks.shift(); }
  stage.querySelectorAll('.opt.pk').forEach(el=>el.classList.toggle('sel', picks.includes(+el.dataset.i)));
  document.getElementById('pkCount').textContent = picks.length+' of 3 picked';
  document.getElementById('pkGo').style.opacity = picks.length===3 ? 1 : .4;
}
function confirmPicks(){
  if(busy || picks.length!==3) return; busy=true;
  const q = flat[idx], tags=[];
  picks.forEach(i=>q.o[i][1].forEach(t=>tags.push(t)));
  bump(tags); history.push({idx:idx, tags:tags, sel:picks.slice()});
  setTimeout(advance, 200);
}
function goBack(){
  if(history.length===0) return;
  const last = history[history.length-1];
  if(usedBack.has(last.idx)) return;
  unbump(last.tags); usedBack.add(last.idx); history.pop();
  idx = last.idx; render();
}
function renderYearLater(){
  stage.innerHTML = `<div class="scene" style="text-align:center">
    <div class="time" style="color:var(--accent);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;font-family:Arial,sans-serif;">Looking back</div>
    <div class="narr">${playerName!=='you' ? playerName+', y' : 'Y'}ou started this without knowing exactly where it would lead.<br><br>
    Some choices were about solving problems. Some were about people.<br>
    Some were about how you wanted to work — and who you wanted to become.</div>
    <button class="cbtn" style="width:100%" onclick="renderAspiration()">Continue →</button></div>`;
}
function renderAspiration(){
  statedThemes = [];
  stage.innerHTML = `<div class="scene"><div class="narr">${ASPIRE.t}</div><div class="ask">${ASPIRE.ask}</div>
   ${Object.keys(PATHS).map(k=>`<button class="opt theme" data-k="${k}" onclick="toggleTheme('${k}')"><b>•</b>${PATHS[k].theme}</button>`).join('')}
   <button class="opt theme" data-k="unsure" onclick="toggleTheme('unsure')"><b>•</b>I'm not sure yet</button>
   <button class="cbtn" id="themeGo" style="width:100%;margin-top:6px;opacity:.4" onclick="confirmThemes()">Continue →</button></div>`;
}
function toggleTheme(k){
  if(k==='unsure'){ statedThemes = statedThemes.includes('unsure') ? [] : ['unsure']; }
  else {
    statedThemes = statedThemes.filter(x=>x!=='unsure');
    if(statedThemes.includes(k)) statedThemes = statedThemes.filter(x=>x!==k);
    else { statedThemes.push(k); if(statedThemes.length>2) statedThemes.shift(); }
  }
  document.querySelectorAll('.opt.theme').forEach(el=>el.classList.toggle('sel', statedThemes.includes(el.dataset.k)));
  const go = document.getElementById('themeGo'); if(go) go.style.opacity = statedThemes.length ? 1 : .4;
}
function confirmThemes(){ if(statedThemes.length) renderSupport(); }
function renderSupport(){
  const letters=['A','B','C','D'];
  stage.innerHTML = `<div class="scene"><div class="ask">What would help you most to get there?</div>
   ${Object.keys(SUPPORT).map((k,i)=>`<button class="opt" onclick="chooseSupport('${k}')"><b>${letters[i]}.</b>${SUPPORT[k]}</button>`).join('')}</div>`;
}
function chooseSupport(k){
  supportKey = k;
  renderResults();
  if(mode==='server') submitResponse();
}
async function submitResponse(){
  stage.innerHTML = `<div class="scene" style="text-align:center"><div class="narr">Saving your responses…</div></div>`;
  const payload = {id:submissionId, browser:browserId(), batch:BATCH, version:'v15', participant:participant,
    answers: history.map(h=>({card:h.idx, picks:h.sel})), tally:tally, summary:lastSummary};
  try{
    const r = await fetch('/api/responses', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'We could not save your responses.');
    saveState = 'saved'; renderResults();
  }catch(e){
    stage.innerHTML = `<div class="scene" style="text-align:center"><div class="narr">${esc(e.message)}</div>
      <div class="note" style="margin-bottom:14px;font-family:Arial,sans-serif;">Your answers are still here. You can retry safely.</div>
      <button class="cbtn" style="width:100%;margin-bottom:10px" onclick="submitResponse()">Try again</button>
      <button class="opt" style="text-align:center" onclick="renderResults()">See my profile without saving</button></div>`;
  }
}

function renderResults(){
  const energiseKey = pickTop(ENERGISE_TAGS) || 'Achievement';
  const whyKey = pickTop(WHY_TAGS) || 'Purpose';
  const carKey = pickTop(Object.keys(CAR)) || 'CarCrossFunctional';
  const learnKey = pickTop(Object.keys(LEARN)) || 'LearnExperiential';
  const envKey = pickTop(Object.keys(ENV)) || 'EnvAutonomous';
    const ts = thinkScores(), tsP = ts[0], tsS = ts[1], thinkBlend = (tsP.pct - tsS.pct) <= 10;
  const pathKey = pickPath(carKey), PATH = PATHS[pathKey];
  const carTot = Object.keys(CAR).reduce((s,k)=>s+(tally[k]||0),0) || 1;
  const carRows = Object.keys(CAR).map(k=>({k, n:tally[k]||0, pct:Math.round((tally[k]||0)/carTot*100)}));
  const carOrdered = [carRows.find(x=>x.k===carKey)].concat(carRows.filter(x=>x.k!==carKey).sort((x,y)=>y.n-x.n));
  const carSec = carOrdered[1] && carOrdered[1].n>0 ? carOrdered[1] : null;
  const carTier = (x,i)=> i===0 ? 'Strongest pull' : (x.pct>=20 ? 'Some pull' : 'Lighter pull');
  const thinkTier = (x,i)=> (i===0 || (thinkBlend && i===1)) ? 'Natural lean' : (x.pct>=25 ? 'Supporting' : 'Less natural');
  const stated = statedThemes.filter(k=>PATHS[k]);
  const lc = t=>t.charAt(0).toLowerCase()+t.slice(1);
  const statedNames = stated.map(k=>lc(PATHS[k].theme)).join(' and ');
  let statedNote;
  if(!stated.length) statedNote = "You weren't sure yet, which is a fine place to be. This profile gives you a starting point.";
  else if(stated.includes(pathKey)) statedNote = `You said you'd like to focus on ${statedNames}, and that lines up with where your choices pointed.`;
  else if(stated.some(k=>PATHS[k].parent===carKey)) statedNote = `You said you'd like to focus on ${statedNames}. That's the same direction as your choices, with a different focus.`;
  else statedNote = `You said you'd like to focus on ${statedNames}, which is different from where your choices leaned. Worth a conversation, not a conclusion.`;
  const extraPath = stated.find(k=>k!==pathKey);
  const shortKey = (k,p)=>k.replace(p,'').replace('SelfDirected','Self-directed');
  lastSummary = {
    careerKey:carKey, careerLabel:CAR[carKey].lbl, pathKey:pathKey, pathLabel:PATH.lbl,
    stated:statedThemes.slice(), statedLabels: stated.length ? stated.map(k=>PATHS[k].theme) : ['Not sure yet'],
    thinkKey:tsP.k, thinkLabel: thinkBlend ? tsP.lbl+' + '+tsS.lbl : tsP.lbl,
    thinkScores: ts.map(x=>({k:x.k,n:x.n,av:x.av})),
    learnKey:learnKey, learnLabel:shortKey(learnKey,'Learn'), envKey:envKey, envLabel:shortKey(envKey,'Env'),
    energiseKey:energiseKey, energiseLabel:LABEL[energiseKey], whyKey:whyKey, whyLabel:LABEL[whyKey],
    supportKey:supportKey, supportLabel:SUPPORT[supportKey]
  };

  stage.innerHTML = `<div class="result">
  ${saveState==='saved' ? '<div class="eyebrow noprint">Responses saved · thank you</div>' : ''}
  <h1>${playerName!=='you' ? esc(playerName)+"\u2019s" : 'Your'} Next Chapter Profile</h1>
  <div class="sub">Not a personality type — a pattern built from every decision you just made.</div>

  <div class="sec"><h3>🔥 Aspiration & Drive</h3>
   <p><b>${LABEL[energiseKey]}.</b> You're energised by ${DRIVER_PHRASE[energiseKey]}.</p></div>

  <div class="sec"><h3>💡 Your Why</h3>
   <p><b>${LABEL[whyKey]}.</b> What matters most to you: ${DRIVER_PHRASE[whyKey]}.</p></div>

  <div class="sec"><h3>🧗 Career Path Pull</h3>
   <p><b>${CAR[carKey].lbl}.</b> ${CAR[carKey].d}${carSec ? ` There's also a pull toward <b>${CAR[carSec.k].lbl}</b>.` : ''}</p>
   <div style="margin-top:10px">${carOrdered.map((x,i)=>`<div class="spec"><div class="lbl"><span>${CAR[x.k].lbl}</span><span>${carTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">Based on your career-related choices in the game.</p>
   <p style="margin-top:12px"><b>Closest growth direction: ${PATH.lbl}.</b> ${PATH.d}</p>
   <p class="note"><b>How this can happen at Aafiyat.</b> ${PATH.route}</p>
   <p class="note">${statedNote}</p></div>

  <div class="sec"><h3>🧭 Learning Style</h3>
   <p>${LEARN[learnKey]}</p></div>

  <div class="sec"><h3>🧠 How You Think</h3>
   <p>${thinkBlend ? `A blend of <b>${tsP.lbl}</b> and <b>${tsS.lbl}</b>.` : `<b>${tsP.lbl}</b>, with a supporting lean toward ${tsS.lbl}.`} ${THINK[tsP.k].d}${thinkBlend ? ' ' + THINK[tsS.k].d : ''}</p>
   <div style="margin-top:10px">${ts.map((x,i)=>`<div class="spec"><div class="lbl"><span>${x.lbl}</span><span>${thinkTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">This shows what comes naturally to you, not what you're capable of. A lighter lean is a stretch area, or a chance to lean on teammates who think differently.</p></div>

  <div class="sec"><h3>⚙️ How You Naturally Work</h3>
   ${SPECTRA.map(s=>`<div class="spec"><div class="lbl"><span>${s.label[0]}</span><span>${s.label[1]}</span></div>
    <div class="track"><div class="dot" style="left:${spectrum(s.l,s.r)}%"></div></div></div>`).join('')}</div>

  <div class="sec"><h3>🚀 Where You Thrive</h3>
   <p>An environment with ${ENV[envKey]}</p></div>

  <div class="sec"><h3>🌱 Development Direction</h3>
   <p>To build toward <b>${PATH.lbl}</b>:</p>
   <ul>${PATH.dev.map(d=>`<li>${d}</li>`).join('')}</ul>
   ${extraPath ? `<p>For the area you picked (<b>${lc(PATHS[extraPath].theme)}</b>):</p><ul>${PATHS[extraPath].dev.map(d=>`<li>${d}</li>`).join('')}</ul>` : ''}
   <p><b>How you'd learn it best.</b> ${METHOD[learnKey]}</p>
   <p style="margin-top:8px"><b>Support that would help most.</b> ${SUPPORT[supportKey]}.</p>
   <p style="margin-top:8px"><b>Your growth edge (${tsP.lbl}).</b> ${EDGE[tsP.k]}</p>
   <p style="margin-top:8px"><b>A stretch for the next 6 months.</b> ${PATH.stretch}</p></div>

  <p class="note">This is a preference indicator, not a ranking or a validated personality or capability assessment.</p>
  <button class="restart noprint" style="background:transparent;color:var(--ink);border:1px solid var(--border)" onclick="window.print()">Print / Save as PDF</button>
  ${mode==='server' ? '' : `<button class="admin-toggle noprint" onclick="toggleAdmin()">🔒 Show L&D scoring view (admin)</button>
  <div class="admin hidden" id="adminPanel"></div>
  <button class="restart" onclick="restart()">Play again</button>`}
  </div>`;
}
function toggleAdmin(){
  const p = document.getElementById('adminPanel');
  p.classList.toggle('hidden');
  if(!p.innerHTML){
    const groups = [['Drivers/Values',Object.keys(DRIVER_PHRASE)],['Career pull',Object.keys(CAR)],['Learning',Object.keys(LEARN)],['Role directions',Object.keys(PATHS)],['Environment',Object.keys(ENV)]];
    let html=`<div style="margin-bottom:6px;">Stated focus (explicit): <b>${statedThemes.map(k=>k==='unsure'?'Not sure yet':PATHS[k].theme).join(' + ')}</b><br>Support wanted: <b>${SUPPORT[supportKey]}</b></div>`;
    html += `<div style="margin:10px 0 4px;font-weight:700;">Thinking style (picks / scenes where available)</div>`;
    thinkScores().forEach(x=>{
      html += `<div class="bar-row"><div class="bar-lbl"><span>${x.lbl}</span><span>${x.n}/${x.av} · ${x.pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${x.pct}%"></div></div></div>`;
    });
    groups.forEach(g=>{
      const max = Math.max(1, ...g[1].map(k=>tally[k]||0));
      html += `<div style="margin:10px 0 4px;font-weight:700;">${g[0]}</div>`;
      g[1].forEach(k=>{
        const n = tally[k]||0;
        html += `<div class="bar-row"><div class="bar-lbl"><span>${LABEL[k]||CAR[k]&&CAR[k].lbl||PATHS[k]&&PATHS[k].lbl||LEARN[k]||ENV[k]||k}</span><span>${n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div></div>`;
      });
    });
    p.innerHTML = html;
  }
}
function restart(){ submissionId=''; saveState=''; lastSummary=null; idx=0; tally={}; statedThemes=[]; supportKey=null; lastChapterShown=0; playerName=""; chapterLog={}; history=[]; usedBack=new Set(); renderIntro(); }
initMode();
</script>
</body>
</html>
