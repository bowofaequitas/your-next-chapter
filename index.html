<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Next Chapter</title>
<style>
:root{--bg:#0d0e14;--card:#171923;--ink:#f0efe9;--sub:#9a9fb0;--accent:#e0a951;--accent2:#7d8cff;--border:#2a2d3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;overflow-x:hidden;}
.frame{width:100%;max-width:620px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}
.letter{background:#000;height:22px;flex-shrink:0;}
.stage{flex:1;padding:22px 22px 34px;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:480px;}
.scene{animation:fadein .5s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.narr{font-size:16px;line-height:1.6;color:var(--ink);margin-bottom:14px;text-align:center;font-style:italic;}
.ask{font-family:Arial,sans-serif;font-weight:700;text-align:center;color:var(--accent2);margin-bottom:16px;font-size:15px;font-style:normal;}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;
padding:14px 16px;margin-bottom:11px;color:var(--ink);font-size:14.5px;line-height:1.4;cursor:pointer;transition:.18s;font-family:inherit;}
.opt b{color:var(--accent);margin-right:8px;}
.opt:hover{border-color:var(--accent);background:rgba(224,169,81,.08);transform:translateX(3px);}
.opt:active{transform:scale(.98);}
.backbtn{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;
margin:0 auto 14px;display:block;font-family:Arial,sans-serif;}
.tapnote{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#8a8f9c);opacity:.7;text-align:center;margin-top:6px;}
.reaction .narr{font-size:16px;color:var(--accent);font-style:normal;font-family:Arial,sans-serif;}
.title-card{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:30px;z-index:20;animation:fadein .6s ease;overflow-y:auto;}
.title-card .emoji{font-size:40px;margin-bottom:14px;}
.title-card .num{color:var(--accent);letter-spacing:.2em;text-transform:uppercase;font-size:12px;margin-bottom:8px;font-family:Arial,sans-serif;}
.title-card h2{margin:0 0 12px;font-size:26px;}
.title-card p{color:var(--sub);font-size:14px;max-width:380px;line-height:1.5;margin-bottom:18px;font-family:Arial,sans-serif;}
.title-card .time{color:var(--sub);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px;font-family:Arial,sans-serif;}
.clue{background:rgba(224,169,81,.08);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12.5px;
color:var(--ink);font-family:Arial,sans-serif;max-width:380px;margin-bottom:20px;line-height:1.5;text-align:left;}
.clue b{color:var(--accent);}
.nameinput{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--ink);
padding:13px;font-size:15px;font-family:Georgia,serif;text-align:center;margin-bottom:16px;}
.cbtn{background:var(--accent);color:#000;border:none;padding:12px 26px;border-radius:24px;font-weight:700;font-size:14px;
letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:Arial,sans-serif;}
.result{padding:0;font-family:Arial,sans-serif;}
.result h1{font-size:22px;color:var(--accent);margin:0 0 4px;font-family:Georgia,serif;}
.result .sub{color:var(--sub);font-size:13px;margin-bottom:20px;}
.sec{border-top:1px solid var(--border);padding:16px 0;}
.sec:first-of-type{border-top:none;}
.sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);}
.sec p{margin:0;font-size:14px;line-height:1.55;color:var(--ink);}
.sec ul{margin:6px 0 10px 18px;padding:0;font-size:14px;line-height:1.55;}
.sec li{margin-bottom:3px;}
.opt.sel{border-color:var(--accent);background:rgba(224,169,81,.14);}
.note{margin-top:8px;font-size:12.5px;color:var(--sub);}
.spec{margin:10px 0;}
.spec .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:4px;}
.spec .track{height:6px;background:var(--border);border-radius:4px;position:relative;}
.spec .track{overflow:visible;}
.spec .fill{height:100%;border-radius:4px;background:var(--accent2);transition:width 1s ease;}
.spec .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);transform:translateX(-50%);transition:left 1s ease;}
.admin-toggle{margin-top:18px;background:none;border:1px dashed var(--border);color:var(--sub);font-size:11.5px;
padding:9px 12px;border-radius:8px;cursor:pointer;width:100%;font-family:Arial,sans-serif;}
.admin{margin-top:12px;font-size:11.5px;color:var(--sub);}
.bar-row{margin:6px 0;}
.bar-lbl{display:flex;justify-content:space-between;margin-bottom:2px;}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent2);}
.restart{margin-top:16px;background:var(--accent);color:#000;border:none;padding:12px;border-radius:10px;font-size:14px;
font-weight:700;cursor:pointer;width:100%;font-family:Arial,sans-serif;}
.hidden{display:none;}
.dots{display:flex;gap:5px;margin-bottom:16px;}
.dot2{flex:1;height:3px;background:var(--border);border-radius:2px;}
.dot2.done{background:var(--accent);}
</style>
</head>
<body>
<div class="frame">
<div class="letter"></div>
<div class="stage" id="stage"></div>
<div class="letter"></div>
</div>
<script>
const CH = [
 {"n":1,"w":"Week 1","e":"🌱","t":"The Opportunity","s":"A Monday assignment that sounds small. It isn't."},
 {"n":2,"w":"Month 2","e":"🧩","t":"The Roadblock","s":"The numbers are starting to agree. Then something shifts."},
 {"n":3,"w":"Month 3","e":"🛤️","t":"The Crossroads","s":"The report is running, people are noticing, and new doors are opening."},
 {"n":4,"w":"Month 5","e":"📚","t":"The Learning Quest","s":"A bigger role is on offer. You're just not fully ready for it yet."},
 {"n":5,"w":"Month 8","e":"⚡","t":"The Pressure Test","s":"The rollout begins. This time, nobody hands you a plan."},
 {"n":6,"w":"Month 11","e":"🚀","t":"Where You Thrive","s":"It worked. Now the question is what kind of place keeps you at your best."}
];
const Q = [
{"c":1,"t":"Monday, 8.45am at Aafiyat. You've barely put your bag down when Kak Yana stops by your desk with a folder.<br><br>“Ada satu benda saya nak minta tolong. Setiap hujung bulan, laporan Finance dengan Operations tak pernah sama. Puan Salwa dah tanya dua kali. Kamu boleh tengokkan? Brief dia ringkas je. Cara nak buat tu, kamu decide sendiri.”","ask":"Back at your desk, what do you do first?","o":[["I ask Kak Yana what “sorted” should look like by next month-end.",["Structure","Achievement"],"Kak Yana thinks for a second. “Satu laporan, satu nombor. Itu je.” At least now you know what you're aiming for.","You started by asking Kak Yana what “sorted” should look like."],["I check whether the report itself is the problem, not just the numbers.",["Innovation","Mastery"],"You open a blank page. Maybe the old format was never going to work in the first place.","You started by questioning the report itself."],["I find out who sends the numbers each month and go talk to them.",["Collaboration","Belonging"],"First stop is Angah's desk. He sends Operations' figures every month, and he has plenty to say.","You started by talking to the people who send the numbers."],["I open both files and work it out as I go.",["Autonomy","Innovation"],"No plan yet. You put Finance's file and Operations' file side by side and start scrolling.","You started by opening both files and working it out as you went."]]},
{"c":1,"t":"By Wednesday, you're sure of one thing: this isn't a typo problem. The two files disagree on more than the numbers, and nobody can tell you why.<br><br>Kak Yana messages you: “Macam mana, dah nampak apa-apa?” You don't have an easy answer yet.","ask":"How do you dig further?","o":[["I pull the raw data and trace where the numbers start to split.",["Mastery","Analytical"],"An hour in, you find it. Finance counts an order when it's invoiced. Operations counts it when it's delivered. Same word, two meanings.","Then you traced the figures back to where they split."],["I sit down with the people who key in the numbers each month.",["Collaboration","Belonging"],"Angah makes teh tarik first, then explains. Finance counts at invoice, Operations at delivery. Nobody ever put the two side by side.","Then you sat down with the people who key in the numbers."],["I sketch two or three ways the report could work instead.",["Innovation","Autonomy"],"Halfway through the third sketch, it clicks. The two teams are counting different things under the same name.","Then you sketched a few ways the report could work instead."],["I fix one small section first and see what changes.",["Growth","Autonomy"],"The test number shifts, but not the way you expected. That's how you find out Finance and Operations don't count the same way.","Then you tested a small fix to see what would happen."]]},
{"c":1,"t":"Friday afternoon. You and Angah finally get the two reports to match, for one month of data. It's the first time in a long while that anyone has seen them agree.<br><br>Kak Yana looks at the screen, then at you. “Okay, ni baru betul.”","ask":"Which part feels best?","o":[["That we pulled it off as a team.",["Collaboration","Belonging"],"You and Angah grin at each other across the desks. A small win, but it's yours together."],["That I got it done myself.",["Achievement","Mastery"],"Nobody saw the late evenings you put in. You know, and that's enough."],["That the real problem is smaller now.",["Impact","Purpose"],"Three days of reconciling every month-end, down to a few clicks. That's what you wanted."],["That people noticed, and it made a difference to them.",["Recognition","Impact"],"Kak Yana mentions it in the team update. Puan Salwa looks up from her laptop."]]},
{"c":1,"t":"Next week is quieter. Kak Yana blocks two free hours in your calendar and tells you: “Dua jam ni kamu guna je ikut mana yang kamu rasa paling berguna.”","ask":"What do you do with them?","o":[["I learn something I'll need for the next stage.",["Growth","Mastery"],"You bookmark three tutorials before you've even finished the first one.","With your free two hours, you learned something for the next stage."],["I fix a clunky step in the monthly process.",["Innovation","Efficiency"],"It's a small fix, but it'll save everyone an hour every month-end.","With your free two hours, you fixed a clunky step in the process."],["I help Angah clear his backlog from the old process.",["Collaboration","Belonging"],"Angah looks relieved. He owes you one now, and he knows it.","With your free two hours, you helped Angah catch up."],["I chase an idea that might go somewhere new.",["Innovation","Autonomy"],"It's a long shot. You follow it anyway.","With your free two hours, you chased a new idea."]]},
{"c":1,"t":"Month-end comes. For the first time in ages, Finance's and Operations' numbers match and nobody argues. Puan Salwa even mentions the report in the management meeting.<br><br>Afterwards, Kak Yana catches you in the pantry. “Dalam projek ni, apa yang kamu paling bangga?”","ask":"What do you tell her?","o":[["“That people can rely on me to get this right.”",["Mastery","Security"],"Kak Yana nods and makes a mental note. You don't ask what it is."],["“That I made something work better than before.”",["Innovation","Achievement"],"You still remember how clunky the old version was."],["“That I got different people working together on it.”",["Collaboration","Influence"],"Even Angah agrees that was the hard part."],["“That it actually changed how people work.”",["Impact","Purpose"],"You mean it, and Kak Yana can tell."]]},
{"c":2,"t":"Month 2. Just as things settle, Operations says they can't change how they count. Their system was built that way. Finance isn't budging either, and Puan Salwa wants one number by next month-end.<br><br>Kak Yana pulls you into the meeting room. “Ada dua pilihan. Satu, kita guna template tetap, dua-dua team hantar ikut format yang sama. Dua, kita bina satu sistem kongsi dari awal. Kamu rasa yang mana sesuai?”","ask":"Which way do you lean?","o":[["The fixed template. We know it'll work.",["Security","Structure"],"Kak Yana nods. Safe, clear, and doable in two weeks.","You chose the fixed template, the safer route."],["The shared system. If it works, it fixes this for good.",["Impact","RiskTaking"],"Kak Yana raises an eyebrow, then says, “Okay, kita cuba.”","You backed building a shared system, even though it was a bigger risk."],["I'd like a day to go through what could go wrong first.",["Analytical","Security"],"She gives you until tomorrow morning. You spend the evening listing risks.","You took a day to weigh the risks before choosing a route."],["I'd try the shared system with one team first, then decide.",["Autonomy","Growth"],"A small pilot buys you room to learn before anyone commits.","You asked to pilot the shared system with one team before committing."]]},
{"c":2,"t":"A week before month-end, the first joint meeting turns tense. Finance and Operations keep talking over each other, and the clock is ticking. Then everyone goes quiet and looks at you.<br><br>Kak Yana: “Okay, {{NAME}}. Sekarang ni, kita nak fokus apa dulu?”","ask":"What's your instinct?","o":[["Get everyone organised: who does what, in what order.",["Structure","Achievement"],"You've written the list on the whiteboard before anyone can object.","In the tense joint meeting, you got everyone organised first."],["Find out what's really causing the mismatch.",["Mastery","Analytical"],"It turns out to be nothing anyone had assumed.","In the tense joint meeting, you went looking for the real cause."],["Get Finance and Operations on the same page first.",["Collaboration","Belonging"],"Ten minutes of talking saves an hour of confusion.","In the tense joint meeting, you got both teams aligned first."],["Step back and see how this fits the bigger picture.",["SystemsThinking","Impact"],"It connects to an older issue that nobody had linked until now.","In the tense joint meeting, you stepped back to see the bigger picture."]]},
{"c":2,"t":"Somehow, the meeting ends with a plan. Afterwards, Kak Yana belanja you teh tarik at the kedai opposite the office. It's the first time you've both sat down all day.<br><br>“Lepas projek ni, kalau ada peluang yang lebih besar, kamu paling berminat dengan yang macam mana?”","ask":"Which sounds most like you?","o":[["Becoming really good at one area, the person people go to.",["CarSpecialist","Mastery"],"You already know which area."],["Leading a team and helping people grow.",["CarPeopleLeader","Influence"],"You picture yourself in Kak Yana's seat, just a little."],["Solving bigger problems across departments.",["CarCrossFunctional","SystemsThinking"],"The bigger picture is where you keep ending up."],["Building something new and changing how we do things.",["CarBuilder","Innovation"],"You'd rather build the next thing than keep fixing the last one."]]},
{"c":2,"t":"The plan means using the reporting system Finance already runs, and you've never touched it. Puan Salwa wants the first joint report out of it in two weeks.","ask":"How would you rather learn it?","o":[["Show me once, then let me try.",["LearnSocial","LearnExperiential"],"Angah walks you through it in ten minutes, then leaves you to it."],["Give me a proper step-by-step guide.",["LearnStructured"],"You read it twice before touching anything."],["Give me a real problem to solve with it.",["LearnExperiential"],"You learn most of it by breaking it first."],["Let me explore it on my own.",["LearnSelfDirected"],"You click around until it starts to make sense."]]},
{"c":2,"t":"On day three, you push a wrong figure into the live file. Angah catches it within minutes and no real damage is done, but Finance saw it.","ask":"What's your first instinct?","o":[["Work out exactly why it happened.",["Analytical","Mastery"],"It turns out to be an easy mistake to make twice.","When you slipped up, you worked out exactly why it happened."],["Try again until I get it right.",["Growth","Achievement"],"Third time's the charm.","When you slipped up, you kept trying until you got it right."],["Ask someone who's done this before.",["Collaboration","Growth"],"Angah has seen this exact error before. He points straight to the fix.","When you slipped up, you asked someone who knew."],["Fix the process so nobody can make this mistake again.",["Innovation","SystemsThinking"],"You leave a note for the next person, too.","When you slipped up, you fixed the process so it couldn't happen again."]]},
{"c":3,"t":"Month-end again. The report goes out, the numbers match, and nobody argues. It's Friday, 5.40pm, and Angah leans on the cubicle wall while you shut down your laptop.<br><br>“Eh, sepanjang bulan ni, hari mana paling best?”","ask":"What was that day like?","o":[["I solved something hard, mostly on my own.",["Autonomy","Mastery"],"Nobody saw the three failed attempts before it finally worked."],["I worked with good people and we moved things forward.",["Collaboration","Belonging"],"It didn't even feel like work, honestly."],["I made real progress on something that mattered.",["Achievement","Impact"],"You crossed it off the list and meant it."],["I learned something new.",["Growth","Innovation"],"You're still thinking about it on the drive home."]]},
{"c":3,"t":"Monday morning, plans change. A customer audit has landed, and Puan Salwa pulls the whole team onto it. The week you had planned isn't the urgent one anymore.","ask":"What do you do?","o":[["Adjust quickly and move with it.",["Adaptability","Achievement"],"You're already three steps into the audit work.","When the audit landed, you adjusted and moved with it."],["Re-plan the week so it's properly managed.",["Structure","Achievement"],"You rebuild the plan before lunch.","When the audit landed, you re-planned the whole week."],["Find out why it changed before I commit.",["Purpose","Analytical"],"Once you know why, it makes a lot more sense.","When the audit landed, you asked why it changed first."],["See what opportunity this opens up.",["Innovation","Autonomy"],"It turns out to be a door, not just a delay.","When the audit landed, you looked for the opportunity in it."]]},
{"c":3,"t":"The audit needs a summary pack for the auditors. Nobody tells you how to build it, and there's no template or past example to copy from.","ask":"What setup suits you best?","o":[["A clear structure to work within.",["Structure"],"Give you the lines and you'll stay neatly inside them.","For the audit pack, you wanted a clear structure to work within."],["The freedom to decide my own approach.",["Autonomy"],"You'd rather find your own way through.","For the audit pack, you wanted the freedom to find your own approach."],["Working through it with other people.",["Collaboration"],"Two heads beat one. You've always thought so.","For the audit pack, you wanted to work through it with other people."],["Time to think it through before I act.",["Analytical"],"You'd rather be right than fast.","For the audit pack, you took time to think it through first."]]},
{"c":3,"t":"Wednesday, and the audit is dragging. Over teh o ais at the canteen, Angah is venting, and honestly, he's right about a few things. A couple of things keep making the work harder than it needs to be.","ask":"Which one frustrates you most?","o":[["Repetitive work that could clearly be improved.",["Innovation","Efficiency"],"You've already half-built a fix for it in your head."],["Unclear or changing expectations.",["Structure","Security"],"You just want to know what “done” looks like."],["Too many approvals slowing things down.",["Autonomy","Efficiency"],"By the time it's approved, it's already outdated."],["Seeing a problem but having no power to fix it.",["Influence","Impact"],"That's the one that actually keeps you up at night."]]},
{"c":3,"t":"Angah laughs, half joking. “Kalau boleh buang satu benda je dari cara kita kerja sekarang, kamu nak buang apa?”","ask":"What goes?","o":[["Manual work that adds very little value.",["Efficiency","Innovation"],"Gone. Nobody misses it.","If you could remove one thing, it would be manual work that adds little value."],["Unclear priorities.",["Structure"],"Suddenly the week makes a lot more sense.","If you could remove one thing, it would be unclear priorities."],["Unnecessary bureaucracy.",["Autonomy","Achievement"],"Three fewer approvals, twice the speed.","If you could remove one thing, it would be unnecessary bureaucracy."],["Work that doesn't create real value.",["Purpose","Impact"],"You'd rather do less that matters than more that doesn't.","If you could remove one thing, it would be work that creates no real value."]]},
{"c":4,"t":"The audit closes with no findings. Puan Salwa now wants to roll the new reporting out to three more departments, and she wants you involved. It would need skills you don't fully have yet. Kak Timah from Planning, who ran a rollout like this a few years ago, has offered to help.<br><br>Kak Yana: “Puan Salwa dah setuju. Tapi sebelum kita teruskan, saya nak tahu dulu. Lagi dua tiga tahun, kamu nampak diri kamu jadi apa?”","ask":"Which future feels most interesting?","o":[["A recognised expert in something I'm great at.",["CarSpecialist","Mastery"],"You can already picture the title.","You told Kak Yana you'd like to be a recognised expert."],["Leading people and helping them get better.",["CarPeopleLeader","Growth"],"You think about who you'd want on your team.","You told Kak Yana you'd like to lead people and help them grow."],["Taking on bigger problems across the whole company.",["CarCrossFunctional","SystemsThinking"],"The messier it is, the more interesting it gets, honestly.","You told Kak Yana you want to take on bigger, company-wide problems."],["Creating new ways of working and driving change.",["CarBuilder","Innovation"],"You'd rather build the new system than maintain the old one.","You told Kak Yana you want to create new ways of working and drive change."]]},
{"c":4,"t":"A few days later, Kak Yana follows up. “Kak Timah sudi tolong. Tapi bagi kamu, cara belajar macam mana yang betul-betul boleh bawa kamu ke tahap tu?”","ask":"Which would help you most?","o":[["A structured programme with clear stages.",["LearnStructured"],"You like knowing what comes next."],["A challenging project where I learn by doing.",["LearnExperiential"],"Throw you in, and you'll figure it out."],["A mentor like Kak Timah, who's done this before.",["LearnSocial"],"Kak Timah makes time for you without being asked twice."],["Good resources, so I can learn on my own.",["LearnSelfDirected"],"Just point you at the material and give you space."]]},
{"c":4,"t":"That night you think about it properly. The rollout is real, and it will shape what your next year looks like. There are a few ways this could go.","ask":"Which next step appeals most?","o":[["Go deeper and get stronger in my own area.",["CarSpecialist","Mastery"],"You'd rather go deep than wide."],["Take on more people and more outcomes.",["CarPeopleLeader","Collaboration"],"You're ready to carry more than just your own work."],["Get broader exposure across different functions.",["CarCrossFunctional","SystemsThinking"],"You'd rather see more of the map."],["Be part of a major transformation.",["CarBuilder","Impact"],"You want to be in the room when things change."]]},
{"c":4,"t":"Next morning, Puan Salwa shares how the rollout will be set up. Four roles need filling, and Kak Yana says you can put your hand up for one.<br><br>“Jangan fikir lama sangat,” she says. “Yang mana, kamu rasa, paling macam kamu?”","ask":"Which role would you put your hand up for?","o":[["Technical lead: the person who knows the new system inside out.",["CarSpecialist","PathTechSpecialist"],"Kak Yana nods. “Lepas ni, semua orang akan cari kamu bila sistem buat hal.”","When Puan Salwa listed the rollout roles, you put your hand up for technical lead."],["Team lead: look after the rollout crew and help them perform.",["CarPeopleLeader","PathTeamLead"],"You picture the Monday huddle with the crew. It feels right.","When Puan Salwa listed the rollout roles, you put your hand up for team lead."],["Business liaison: the link between the departments and the new system.",["CarCrossFunctional","PathBizPartner"],"Three departments, three ways of talking. You'd enjoy translating between them.","When Puan Salwa listed the rollout roles, you put your hand up for business liaison."],["Automation lead: find what can be simplified or automated.",["CarBuilder","PathDigitalBuilder"],"You're already listing the steps a script could do for you.","When Puan Salwa listed the rollout roles, you put your hand up for automation lead."]]},
{"c":4,"t":"Over coffee with Kak Timah, she asks you the question someone once asked her. “Lima tahun dari sekarang, bila kamu tengok balik, apa yang buat kamu rasa semua ni berbaloi?”","ask":"What would it be?","o":[["I became genuinely excellent at something.",["Mastery","Achievement"],"You'd know it, even if nobody else did."],["I helped people grow and succeed.",["Collaboration","Growth"],"Their wins would feel like yours."],["I solved something that affected the whole company.",["Impact","SystemsThinking"],"Small effort, big ripple. That's the dream."],["I built something that outlasted me.",["Purpose","LastingValue"],"Still running long after you've moved on."]]},
{"c":4,"t":"Puan Salwa confirms the rollout. Three departments want to go first, and Kak Yana says you can choose where to start. Each one is a very different kind of project.","ask":"Which would you start with?","o":[["The one that makes me learn something I don't know yet.",["Growth","Mastery"],"Uncomfortable at first. Worth it later.","For the rollout, you chose the project that would stretch a skill you lack."],["The one where the impact would be clearest.",["Impact","Purpose"],"You want to point at something and say, “that mattered.”","For the rollout, you chose the project with the clearest impact."],["The one that involves the most people and teams.",["Collaboration","Integration"],"More moving parts, and more interesting to you.","For the rollout, you chose the project that spanned the most teams."],["The one where I'd have real ownership.",["Autonomy","Achievement"],"Yours to shape, start to finish.","For the rollout, you chose the project where you'd have full ownership."]]},

function pickPath(carKey){
  const kids = Object.keys(PATHS).filter(k=>PATHS[k].parent===carKey);
  const na = tally[kids[0]]||0, nb = tally[kids[1]]||0;
  if(na!==nb) return na>nb ? kids[0] : kids[1];
  const style = thinkScores()[0].k;
  return PATHS[kids[0]].styles.includes(style) ? kids[0] : kids[1];
}

const THINK_AVAIL = {};
Object.keys(THINK).forEach(k=>THINK_AVAIL[THINK[k].tag]=0);
Object.keys(THINK_MAP).forEach(qi=>{
  THINK_MAP[qi].forEach((s,oi)=>{
    if(s){ const t = THINK[s].tag; Q[qi].o[oi][1].push(t); THINK_AVAIL[t]++; }

function thinkScores(){
  return Object.keys(THINK).map(k=>{
    const t = THINK[k].tag, av = THINK_AVAIL[t]||1, n = tally[t]||0;
    return {k, lbl:THINK[k].lbl, n, av, pct:Math.round(n/av*100)};
  }).sort((a,b)=> b.pct-a.pct || b.n-a.n);
}

function bump(tags){ tags.forEach(t=>tally[t]=(tally[t]||0)+1); }
function unbump(tags){ tags.forEach(t=>{ if(tally[t]) tally[t]--; }); }
function pickTop(keys){ let best=null,n=-1; keys.forEach(k=>{ if((tally[k]||0)>n){n=tally[k]||0;best=k;} }); return best; }
function spectrum(l,r){ const L=tally[l]||0,R=tally[r]||0; if(L+R===0) return 50; return Math.round(R/(L+R)*100); }
function nm(s){ s = s||'';
  if(playerName && playerName!=='you') return s.split('{{NAME}}').join(playerName);
  return s.replace(/,\s*\{\{NAME\}\}/g,'').replace(/\{\{NAME\}\},\s*/g,'').split('{{NAME}}').join('you'); }

function renderChapterCard(cnum){

  const prev = chapterLog[cnum-1];
  let recap = '';
  if(prev && prev.length){
    recap = `<div class="clue"><b>Previously:</b> ${prev.slice(0,3).join(' ')}</div>`;
  }
  stage.innerHTML = `<div class="title-card">
    <div class="time">${ch.w}</div>
    <div class="emoji">${ch.e}</div><div class="num">Chapter ${ch.n}</div>
    <h2>${ch.t}</h2><p>${nm(ch.s)}</p>
    ${recap}
    <button class="cbtn" onclick="dismissCard()">Continue</button></div>`;
}
function dismissCard(){ renderScene(flat[idx]); }
function renderScene(q){
  let dots=''; for(let i=0;i<CH.length;i++){ dots+=`<div class="dot2 ${i < (q.c||CH.length) ? 'done':''}"></div>`; }
  const letters=['A','B','C','D'];
  const canBack = history.length>0 && !usedBack.has(history[history.length-1].idx);
  stage.innerHTML = `<div class="scene"><div class="dots">${dots}</div>
    ${canBack ? `<button class="backbtn" onclick="goBack()">← Change my last answer</button>` : ''}
    <div class="narr">${nm(q.t)}</div><div class="ask">${nm(q.ask)}</div>
    ${q.o.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${letters[i]}.</b>${o[0]}</button>`).join('')}
    </div>`;
}
function choose(i){
  const q = flat[idx];
  const opt = q.o[i];
  bump(opt[1]);
  const hasRecap = !!(q.c && opt[3]);
  if(hasRecap){ (chapterLog[q.c] = chapterLog[q.c]||[]).push(opt[3]); }
  history.push({idx:idx, tags:opt[1], chapter:q.c, rec:hasRecap});
  const txt = nm(opt[2]);
  stage.innerHTML = `<div class="scene reaction" style="cursor:pointer"><div class="narr">${txt}</div><div class="tapnote">tap to continue</div></div>`;
  idx++;
  let moved = false, tm = null;
  const go = ()=>{ if(moved) return; moved = true; clearTimeout(tm); if(idx>=flat.length) renderYearLater(); else render(); };
  tm = setTimeout(go, Math.min(4500, 1200 + txt.split(' ').length*240));
  stage.firstChild.onclick = go;
}
function goBack(){
  if(history.length===0) return;
  const last = history[history.length-1];
  if(usedBack.has(last.idx)) return;
  unbump(last.tags);
  if(last.chapter && last.rec){ const log = chapterLog[last.chapter]; if(log && log.length) log.pop(); }
  usedBack.add(last.idx);
  history.pop();
  idx = last.idx;
  renderScene(flat[idx]);
}

  statedThemes = [];
  stage.innerHTML = `<div class="scene"><div class="narr">${ASPIRE.t}</div><div class="ask">${ASPIRE.ask}</div>
   ${Object.keys(PATHS).map(k=>`<button class="opt theme" data-k="${k}" onclick="toggleTheme('${k}')"><b>•</b>${PATHS[k].theme}</button>`).join('')}
   <button class="opt theme" data-k="unsure" onclick="toggleTheme('unsure')"><b>•</b>I'm not sure yet</button>
   <button class="cbtn" id="themeGo" style="width:100%;margin-top:6px;opacity:.4" onclick="confirmThemes()">Continue →</button></div>`;
}
function toggleTheme(k){
  if(k==='unsure'){ statedThemes = statedThemes.includes('unsure') ? [] : ['unsure']; }
  else {
    statedThemes = statedThemes.filter(x=>x!=='unsure');
    if(statedThemes.includes(k)) statedThemes = statedThemes.filter(x=>x!==k);
    else { statedThemes.push(k); if(statedThemes.length>2) statedThemes.shift(); }
  }
  document.querySelectorAll('.opt.theme').forEach(el=>el.classList.toggle('sel', statedThemes.includes(el.dataset.k)));
  const go = document.getElementById('themeGo'); if(go) go.style.opacity = statedThemes.length ? 1 : .4;
}
function confirmThemes(){ if(statedThemes.length) renderSupport(); }
function renderSupport(){
  const letters=['A','B','C','D'];
  stage.innerHTML = `<div class="scene"><div class="ask">What would help you most to get there?</div>
   ${Object.keys(SUPPORT).map((k,i)=>`<button class="opt" onclick="chooseSupport('${k}')"><b>${letters[i]}.</b>${SUPPORT[k]}</button>`).join('')}</div>`;
}
function chooseSupport(k){ supportKey = k; renderResults(); }

function renderResults(){
  const energiseKey = pickTop(ENERGISE_TAGS) || 'Achievement';
  const whyKey = pickTop(WHY_TAGS) || 'Purpose';
  const carKey = pickTop(Object.keys(CAR)) || 'CarCrossFunctional';
  const learnKey = pickTop(Object.keys(LEARN)) || 'LearnExperiential';
  const envKey = pickTop(Object.keys(ENV)) || 'EnvAutonomous';
    const ts = thinkScores(), tsP = ts[0], tsS = ts[1], thinkBlend = (tsP.pct - tsS.pct) <= 10;
  const pathKey = pickPath(carKey), PATH = PATHS[pathKey];
  const carTot = Object.keys(CAR).reduce((s,k)=>s+(tally[k]||0),0) || 1;
  const carRows = Object.keys(CAR).map(k=>({k, n:tally[k]||0, pct:Math.round((tally[k]||0)/carTot*100)}));
  const carOrdered = [carRows.find(x=>x.k===carKey)].concat(carRows.filter(x=>x.k!==carKey).sort((x,y)=>y.n-x.n));
  const carSec = carOrdered[1] && carOrdered[1].n>0 ? carOrdered[1] : null;
  const carTier = (x,i)=> i===0 ? 'Strongest pull' : (x.pct>=20 ? 'Some pull' : 'Lighter pull');
  const thinkTier = (x,i)=> (i===0 || (thinkBlend && i===1)) ? 'Natural lean' : (x.pct>=25 ? 'Supporting' : 'Less natural');
  const stated = statedThemes.filter(k=>PATHS[k]);
  const lc = t=>t.charAt(0).toLowerCase()+t.slice(1);
  const statedNames = stated.map(k=>lc(PATHS[k].theme)).join(' and ');
  let statedNote;
  if(!stated.length) statedNote = "You weren't sure yet, which is a fine place to be. This profile gives you a starting point.";
  else if(stated.includes(pathKey)) statedNote = `You said you'd like to focus on ${statedNames}, and that lines up with where your choices pointed.`;
  else if(stated.some(k=>PATHS[k].parent===carKey)) statedNote = `You said you'd like to focus on ${statedNames}. That's the same direction as your choices, with a different focus.`;
  else statedNote = `You said you'd like to focus on ${statedNames}, which is different from where your choices leaned. Worth a conversation, not a conclusion.`;
  const extraPath = stated.find(k=>k!==pathKey);

  stage.innerHTML = `<div class="result">
  <h1>${playerName!=='you' ? playerName+"\u2019s" : 'Your'} Next Chapter Profile</h1>
  <div class="sub">Not a personality type — a pattern built from every decision you just made.</div>

  <div class="sec"><h3>🔥 Aspiration & Drive</h3>
   <p><b>${LABEL[energiseKey]}.</b> You're energised by ${DRIVER_PHRASE[energiseKey]}.</p></div>

  <div class="sec"><h3>💡 Your Why</h3>
   <p><b>${LABEL[whyKey]}.</b> What matters most to you: ${DRIVER_PHRASE[whyKey]}.</p></div>

  <div class="sec"><h3>🧗 Career Path Pull</h3>
   <p><b>${CAR[carKey].lbl}.</b> ${CAR[carKey].d}${carSec ? ` There's also a pull toward <b>${CAR[carSec.k].lbl}</b>.` : ''}</p>
   <div style="margin-top:10px">${carOrdered.map((x,i)=>`<div class="spec"><div class="lbl"><span>${CAR[x.k].lbl}</span><span>${carTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">Based on your career-related choices in the story.</p>
   <p style="margin-top:12px"><b>Closest growth direction: ${PATH.lbl}.</b> ${PATH.d}</p>
   <p class="note"><b>How this can happen at Aafiyat.</b> ${PATH.route}</p>
   <p class="note">${statedNote}</p></div>

  <div class="sec"><h3>🧭 Learning Style</h3>
   <p>${LEARN[learnKey]}</p></div>

  <div class="sec"><h3>🧠 How You Think</h3>
   <p>${thinkBlend ? `A blend of <b>${tsP.lbl}</b> and <b>${tsS.lbl}</b>.` : `<b>${tsP.lbl}</b>, with a supporting lean toward ${tsS.lbl}.`} ${THINK[tsP.k].d}${thinkBlend ? ' ' + THINK[tsS.k].d : ''}</p>
   <div style="margin-top:10px">${ts.map((x,i)=>`<div class="spec"><div class="lbl"><span>${x.lbl}</span><span>${thinkTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">This shows what comes naturally to you, not what you're capable of. A lighter lean is a stretch area, or a chance to lean on teammates who think differently.</p></div>

  <div class="sec"><h3>⚙️ How You Naturally Work</h3>
   ${SPECTRA.map(s=>`<div class="spec"><div class="lbl"><span>${s.label[0]}</span><span>${s.label[1]}</span></div>
    <div class="track"><div class="dot" style="left:${spectrum(s.l,s.r)}%"></div></div></div>`).join('')}</div>

  <div class="sec"><h3>🚀 Where You Thrive</h3>
   <p>An environment with ${ENV[envKey]}</p></div>

  <div class="sec"><h3>🌱 Development Direction</h3>
   <p>To build toward <b>${PATH.lbl}</b>:</p>
   <ul>${PATH.dev.map(d=>`<li>${d}</li>`).join('')}</ul>
   ${extraPath ? `<p>For the area you picked (<b>${lc(PATHS[extraPath].theme)}</b>):</p><ul>${PATHS[extraPath].dev.map(d=>`<li>${d}</li>`).join('')}</ul>` : ''}
   <p><b>How you'd learn it best.</b> ${METHOD[learnKey]}</p>
   <p style="margin-top:8px"><b>Support that would help most.</b> ${SUPPORT[supportKey]}.</p>
   <p style="margin-top:8px"><b>Your growth edge (${tsP.lbl}).</b> ${EDGE[tsP.k]}</p>
   <p style="margin-top:8px"><b>A stretch for the next 6 months.</b> ${PATH.stretch}</p></div>

  <button class="admin-toggle" onclick="toggleAdmin()">🔒 Show L&D scoring view (admin)</button>
  <div class="admin hidden" id="adminPanel"></div>
  <button class="restart" onclick="restart()">Play again</button>
  </div>`;
}
function toggleAdmin(){
  const p = document.getElementById('adminPanel');
  p.classList.toggle('hidden');
  if(!p.innerHTML){
    const groups = [['Drivers/Values',Object.keys(DRIVER_PHRASE)],['Career pull',Object.keys(CAR)],['Learning',Object.keys(LEARN)],['Role directions',Object.keys(PATHS)],['Environment',Object.keys(ENV)]];
    let html=`<div style="margin-bottom:6px;">Stated focus (explicit): <b>${statedThemes.map(k=>k==='unsure'?'Not sure yet':PATHS[k].theme).join(' + ')}</b><br>Support wanted: <b>${SUPPORT[supportKey]}</b></div>`;
    html += `<div style="margin:10px 0 4px;font-weight:700;">Thinking style (picks / scenes where available)</div>`;
    thinkScores().forEach(x=>{
      html += `<div class="bar-row"><div class="bar-lbl"><span>${x.lbl}</span><span>${x.n}/${x.av} · ${x.pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${x.pct}%"></div></div></div>`;
    });
    groups.forEach(g=>{
      const max = Math.max(1, ...g[1].map(k=>tally[k]||0));
      html += `<div style="margin:10px 0 4px;font-weight:700;">${g[0]}</div>`;
      g[1].forEach(k=>{
        const n = tally[k]||0;
        html += `<div class="bar-row"><div class="bar-lbl"><span>${LABEL[k]||CAR[k]&&CAR[k].lbl||PATHS[k]&&PATHS[k].lbl||LEARN[k]||ENV[k]||k}</span><span>${n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div></div>`;
      });
    });
    p.innerHTML = html;
  }
}
function restart(){ idx=0; tally={}; statedThemes=[]; supportKey=null; lastChapterShown=0; playerName=""; chapterLog={}; history=[]; usedBack=new Set(); renderIntro(); }
renderIntro();
</script>
</body>
</html>
