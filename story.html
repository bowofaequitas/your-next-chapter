<style>
:root{--bg:#0d0e14;--card:#171923;--ink:#f0efe9;--sub:#9a9fb0;--accent:#e0a951;--accent2:#7d8cff;--border:#2a2d3a;

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;justify-content:center;overflow-x:hidden;}
.frame{width:100%;max-width:620px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;}
.letter{background:#000;height:22px;flex-shrink:0;}
.stage{flex:1;padding:22px 22px 34px;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:480px;}
.scene{animation:fadein .5s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.narr{font-size:16px;line-height:1.6;color:var(--ink);margin-bottom:14px;text-align:center;font-style:italic;}
.ask{font-family:Arial,sans-serif;font-weight:700;text-align:center;color:var(--accent2);margin-bottom:16px;font-size:15px;font-style:normal;}
.opt{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;
padding:14px 16px;margin-bottom:11px;color:var(--ink);font-size:14.5px;line-height:1.4;cursor:pointer;transition:.18s;font-family:inherit;}
.opt b{color:var(--accent);margin-right:8px;}
.opt:hover{border-color:var(--accent);background:rgba(224,169,81,.08);transform:translateX(3px);}
.opt:active{transform:scale(.98);}
.backbtn{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;cursor:pointer;
margin:0 auto 14px;display:block;font-family:Arial,sans-serif;}
.tapnote{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#8a8f9c);opacity:.7;text-align:center;margin-top:6px;}
.reaction .narr{font-size:16px;color:var(--accent);font-style:normal;font-family:Arial,sans-serif;}
.title-card{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:30px;z-index:20;animation:fadein .6s ease;overflow-y:auto;}
.title-card .emoji{font-size:40px;margin-bottom:14px;}
.title-card .num{color:var(--accent);letter-spacing:.2em;text-transform:uppercase;font-size:12px;margin-bottom:8px;font-family:Arial,sans-serif;}
.title-card h2{margin:0 0 12px;font-size:26px;}
.title-card p{color:var(--sub);font-size:14px;max-width:380px;line-height:1.5;margin-bottom:18px;font-family:Arial,sans-serif;}
.title-card .time{color:var(--sub);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px;font-family:Arial,sans-serif;}
.clue{background:rgba(224,169,81,.08);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12.5px;
color:var(--ink);font-family:Arial,sans-serif;max-width:380px;margin-bottom:20px;line-height:1.5;text-align:left;}
.clue b{color:var(--accent);}
.nameinput{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;color:var(--ink);
padding:13px;font-size:15px;font-family:Georgia,serif;text-align:center;margin-bottom:16px;}
.cbtn{background:var(--accent);color:#000;border:none;padding:12px 26px;border-radius:24px;font-weight:700;font-size:14px;
letter-spacing:.05em;text-transform:uppercase;cursor:pointer;font-family:Arial,sans-serif;}
.result{padding:0;font-family:Arial,sans-serif;}
.result h1{font-size:22px;color:var(--accent);margin:0 0 4px;font-family:Georgia,serif;}
.result .sub{color:var(--sub);font-size:13px;margin-bottom:20px;}
.sec{border-top:1px solid var(--border);padding:16px 0;}
.sec:first-of-type{border-top:none;}
.sec h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent2);}
.sec p{margin:0;font-size:14px;line-height:1.55;color:var(--ink);}
.sec ul{margin:6px 0 10px 18px;padding:0;font-size:14px;line-height:1.55;}
.sec li{margin-bottom:3px;}
.opt.sel{border-color:var(--accent);background:rgba(224,169,81,.14);}
.note{margin-top:8px;font-size:12.5px;color:var(--sub);}
.spec{margin:10px 0;}
.spec .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:4px;}
.spec .track{height:6px;background:var(--border);border-radius:4px;position:relative;}
.spec .track{overflow:visible;}
.spec .fill{height:100%;border-radius:4px;background:var(--accent2);transition:width 1s ease;}
.spec .dot{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--accent2);transform:translateX(-50%);transition:left 1s ease;}
.admin-toggle{margin-top:18px;background:none;border:1px dashed var(--border);color:var(--sub);font-size:11.5px;
padding:9px 12px;border-radius:8px;cursor:pointer;width:100%;font-family:Arial,sans-serif;}
.admin{margin-top:12px;font-size:11.5px;color:var(--sub);}
.bar-row{margin:6px 0;}
.bar-lbl{display:flex;justify-content:space-between;margin-bottom:2px;}
.bar-track{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
.bar-fill{height:100%;background:var(--accent2);}
.restart{margin-top:16px;background:var(--accent);color:#000;border:none;padding:12px;border-radius:10px;font-size:14px;
font-weight:700;cursor:pointer;width:100%;font-family:Arial,sans-serif;}
.hidden{display:none;}
.count{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.1em;color:var(--sub);text-align:right;margin:-8px 0 12px;}
.dots{display:flex;gap:5px;margin-bottom:16px;}
.dot2{flex:1;height:3px;background:var(--border);border-radius:2px;}
.dot2.done{background:var(--accent);}
</style>

{"c":2,"t":"Month 2. Operations can't change how they count, and Puan Salwa wants one number. Kak Yana: “Dua pilihan: template tetap, atau bina satu sistem kongsi. Kamu rasa mana?”","ask":"Which way do you lean?","o":[["Fixed template. We know it works.",["Security","Structure"],"Safe, clear, done in two weeks.","You chose the fixed template, the safer route."],["Shared system. It fixes this for good.",["Impact","RiskTaking"],"She raises an eyebrow. “Okay, kita cuba.”","You backed a shared system, the bigger risk."],["Give me a day to check the risks.",["Analytical","Security"],"You spend the evening listing them.","You took a day to weigh the risks first."],["Pilot the shared system with one team.",["Autonomy","Growth"],"A small pilot buys room to learn.","You piloted the shared system with one team first."]]},
{"c":2,"t":"A week before month-end, Finance and Operations talk over each other. Then everyone looks at you. Kak Yana: “Okay, {{NAME}}. Kita fokus apa dulu?”","ask":"What's your instinct?","o":[["Organise who does what, in what order.",["Structure","Achievement"],"The list is on the whiteboard in a minute.","In the tense meeting, you organised who does what."],["Find the real cause of the mismatch.",["Mastery","Analytical"],"It's not what anyone assumed.","In the tense meeting, you went looking for the real cause."],["Get both teams on the same page.",["Collaboration","Belonging"],"Ten minutes of talking saves an hour.","In the tense meeting, you aligned both teams first."],["Step back and see the bigger picture.",["SystemsThinking","Impact"],"It links to an older issue nobody connected.","In the tense meeting, you stepped back to see the bigger picture."]]},
{"c":2,"t":"The plan runs on Finance's reporting system. You've never used it, and the first joint report is due in two weeks.","ask":"How would you rather learn it?","o":[["Show me once, then let me try.",["LearnSocial","LearnExperiential"],"Angah shows you in ten minutes."],["Give me a step-by-step guide.",["LearnStructured"],"You read it twice before touching anything."],["Give me a real problem to solve.",["LearnExperiential"],"You learn most of it by breaking it."],["Let me explore on my own.",["LearnSelfDirected"],"You click around until it makes sense."]]},
{"c":3,"t":"Month-end again, numbers match. It's Friday, 5.40pm, and Angah leans on your cubicle: “Hari mana paling best bulan ni?”","ask":"What was that day like?","o":[["I solved something hard, mostly alone.",["Autonomy","Mastery"],"Nobody saw the failed attempts."],["I worked with good people.",["Collaboration","Belonging"],"It didn't even feel like work."],["I made real progress on something that mattered.",["Achievement","Impact"],"You crossed it off and meant it."],["I learned something new.",["Growth","Innovation"],"Still thinking about it on the drive home."]]},

{"c":3,"t":"The audit needs a summary pack. No template, no example.","ask":"What setup suits you best?","o":[["Clear structure to work within.",["Structure"],"Give you the lines, you'll stay inside them.","For the audit pack, you wanted clear structure."],["Freedom to find my own way.",["Autonomy"],"You'd rather find your own route.","For the audit pack, you wanted freedom to find your own way."],["Work it out with others.",["Collaboration"],"Two heads beat one.","For the audit pack, you wanted to work it out with others."],["Time to think before acting.",["Analytical"],"You'd rather be right than fast.","For the audit pack, you took time to think first."]]},

{"c":5,"t":"The rollout wraps up well. In the corridor, Puan Salwa: “Lepas ni saya nak bagi lebih tanggungjawab pada beberapa orang. Kamu nak berkembang ke arah mana?”","ask":"Which area would you grow into?","o":[["Trainer and coach: help people get good at the new way.",["CarSpecialist","PathCoachSME"],"You've quietly helped many already.","When Puan Salwa offered more responsibility, you chose training and coaching."],["Project lead: run the next rollout.",["CarPeopleLeader","PathProgrammeLead"],"Timelines, risks, check-ins. You'd enjoy it.","When Puan Salwa offered more responsibility, you chose project lead."],["Planner: use numbers to decide what's next.",["CarCrossFunctional","PathStrategist"],"You'd rather help choose the direction.","When Puan Salwa offered more responsibility, you chose planning."],["Change lead: help departments adjust.",["CarBuilder","PathChangeLead"],"Every rollout comes down to people.","When Puan Salwa offered more responsibility, you chose change lead."]]},

  route:"There is no separate specialist title today (Executive, HOS, HOD). This grows by staying and deepening in your function, taking on harder assignments, and becoming the recognised go-to person.",
  dev:["Advanced technical or functional certification in your area","A deep-dive on one process or system until you're the go-to reference","Documentation and knowledge-sharing skills, so your expertise travels","Data analysis and troubleshooting depth"],
  stretch:"Own one system or process end to end, and write the reference guide that others will use."},
 PathCoachSME:{parent:"CarSpecialist",lbl:"Coach & Capability Builder",theme:"Coaching and training others",styles:['C','V'],
  d:"You'd grow by turning what you know into other people's skill.",
  route:"Mostly through assignments: internal trainer or mentor for new joiners and colleagues, working alongside L&D.",
  dev:["Facilitation and training delivery","Coaching conversations (for example the GROW model) and giving feedback","Learning design basics: turning a process into a short, usable session","Presentation and communication skills"],
  stretch:"Run one short internal session on something you know well, then collect feedback and improve it."},
 PathTeamLead:{parent:"CarPeopleLeader",lbl:"People Leader (HOS / HOD track)",theme:"Leading people",styles:['C','V'],
  d:"You'd grow by taking responsibility for people and how they perform.",
  route:"This is the formal route: Executive, then Head of Section (HOS), then Head of Department (HOD). Leading a small crew or project first is a good way to test it.",
  dev:["First-time leader programme","Delegation and setting clear expectations","Performance and feedback conversations","Handling conflict and building team trust"],
  stretch:"Lead a small team or project crew for a set period, with a mentor to debrief with."},
 PathProgrammeLead:{parent:"CarPeopleLeader",lbl:"Project & Delivery Lead",theme:"Running projects from plan to delivery",styles:['E','A'],
  d:"You'd grow by taking a goal from plan to done, across people and deadlines.",
  route:"Mostly through assignments: leading cross-team projects and rollouts alongside your normal role. It is also a good proving ground for the HOS track.",
  dev:["Project management fundamentals: planning, scheduling and risk","Tracking budget, resources and progress reporting","Stakeholder updates and expectation-setting","Negotiating priorities under deadline pressure"],
  stretch:"Plan and run a cross-department project with a real deadline, and report progress to management."},
 PathBizPartner:{parent:"CarCrossFunctional",lbl:"Cross-department Partner",theme:"Working across departments",styles:['C','E'],
  d:"You'd grow as the person who connects departments, someone who understands each side and gets them working together.",
  route:"There is no dedicated role for this today. It grows through cross-department projects, working groups and process-owner assignments. The closest formal seat is Process & Digitalization Executive, but seats are very few.",
  dev:["Stakeholder management and influencing without authority","Business acumen: how other departments really work","Gathering requirements and translating needs between teams","Presenting and negotiating with senior people"],
  stretch:"Be the named point of contact between two departments on one live project."},
 PathStrategist:{parent:"CarCrossFunctional",lbl:"Strategist & Planner",theme:"Planning, analysis and strategy",styles:['A','V'],
  d:"You'd grow by helping decide where the business goes next, using data and the bigger picture.",
  route:"Mostly through assignments: business-plan and performance work, analysis, and preparing recommendations for HOS, HOD and management.",
  dev:["Strategic thinking and scenario planning","KPI design and business analysis","Data storytelling: turning numbers into a recommendation","Decision-making frameworks and presenting to management"],
  stretch:"Write a short recommendation paper for management on a real question, backed by data."},
 PathDigitalBuilder:{parent:"CarBuilder",lbl:"Digital & Automation Builder",theme:"Digital, automation and AI skills",styles:['E','A'],
  d:"You'd grow by building better tools and systems: automating work and making new things possible.",
  route:"The closest formal seat is Process & Digitalization Executive, but seats are very few. More widely, it happens through automation and AI champion assignments in your own function.",
  dev:["Process automation and low-code tools","Data and AI literacy, including practical AI tools at work","Systems analysis: how business processes map onto systems","Running small experiments and proofs of concept"],
  stretch:"Automate one repetitive task end to end, and measure the time it saves."},
 PathChangeLead:{parent:"CarBuilder",lbl:"Change & Improvement Lead",theme:"Improving processes and leading change",styles:['V','C'],
  d:"You'd grow by helping people and teams adopt better ways of working.",
  route:"Mostly through assignments: improvement or change champion on projects and rollouts, alongside your normal role.",
  dev:["Process improvement methods such as Lean or Kaizen","Change management: bringing people along, not just the process","Running workshops and facilitating groups","Measuring and reporting the benefits of a change"],
  stretch:"Lead one improvement or change effort from first idea to a measured result."}
};
const METHOD = {LearnStructured:"A structured pathway suits you best: a clear programme or certification with defined stages and milestones.",
 LearnExperiential:"Learning by doing suits you best: a stretch assignment or live project, with a short debrief afterwards.",
 LearnSocial:"Learning through people suits you best: a mentor, shadowing someone already in the role, and regular conversations.",
 LearnSelfDirected:"Self-paced learning suits you best: good resources and room to explore, with an occasional check-in."};
const EDGE = {V:"Pair big ideas with clear milestones and a follow-through partner, so good ideas actually land.",
 E:"Before moving, check the assumptions and the data. A short pause can save a rework.",
 A:"Practise deciding with about 70% of the information, and keep the explanation simple for people who just need the answer.",
 C:"Build confidence in making an independent call, backed by data, when the group can't agree."};
function pickPath(carKey){
  const kids = Object.keys(PATHS).filter(k=>PATHS[k].parent===carKey);
  const na = tally[kids[0]]||0, nb = tally[kids[1]]||0;
  if(na!==nb) return na>nb ? kids[0] : kids[1];
  const style = thinkScores()[0].k;
  return PATHS[kids[0]].styles.includes(style) ? kids[0] : kids[1];
}
const SPECTRA = [
 {label:["Structured","Autonomous"], l:"Structure", r:"Autonomy"},
 {label:["Independent","Collaborative"], l:"Autonomy", r:"Collaboration"},
 {label:["Detail-focused","Big-picture"], l:"Analytical", r:"SystemsThinking"},
 {label:["Execution","Exploration"], l:"Achievement", r:"Innovation"},
 {label:["Stability","Ambiguity"], l:"Security", r:"RiskTaking"},
 {label:["Task-focused","People-focused"], l:"Achievement", r:"Collaboration"},
];

// ---- Thinking style (Visionary / Executor / Analyst / Connector) ----
// Applied only to decision-style scenes where each style has a natural option.
// Index = position in Q; array = style per option A-D (null = option carries no thinking-style signal).
const THINK = {
 V:{tag:"ThinkVisionary",lbl:"Visionary",d:"You tend to start with the bigger picture — where this could go and what could be done differently — before settling the details."},
 E:{tag:"ThinkExecutor",lbl:"Executor",d:"You tend to think by doing — turning plans into progress quickly, and settling once there's something concrete moving."},
 A:{tag:"ThinkAnalyst",lbl:"Analyst",d:"You tend to think by understanding — looking for the evidence and root cause before you commit to a direction."},
 C:{tag:"ThinkConnector",lbl:"Connector",d:"You tend to think through people — reading the room, aligning perspectives and bringing others in to reach the best answer."}
};
const THINK_MAP = {
  0:['E','V','C',null],
  1:['A','C','V','E'],
  5:['E','A','C','V'],
  8:['E',null,'A','V'],
  15:['E',null,'C','A'],
  16:['A','C','E','V'],
  17:[null,'C','V','E'],
  21:['E','V',null,'C'],
};
const THINK_AVAIL = {};
Object.keys(THINK).forEach(k=>THINK_AVAIL[THINK[k].tag]=0);
Object.keys(THINK_MAP).forEach(qi=>{
  THINK_MAP[qi].forEach((s,oi)=>{
    if(s){ const t = THINK[s].tag; Q[qi].o[oi][1].push(t); THINK_AVAIL[t]++; }
  });
});
function thinkScores(){
  return Object.keys(THINK).map(k=>{
    const t = THINK[k].tag, av = THINK_AVAIL[t]||1, n = tally[t]||0;
    return {k, lbl:THINK[k].lbl, n, av, pct:Math.round(n/av*100)};
  }).sort((a,b)=> b.pct-a.pct || b.n-a.n);
}

let flat = [];
Q.forEach(q=>flat.push(q)); flat.push(FINAL);
let idx=0, tally={}, statedThemes=[], supportKey=null, stage=document.getElementById('stage'), lastChapterShown=0, playerName="";
let chapterLog={}, history=[], usedBack=new Set();

function bump(tags){ tags.forEach(t=>tally[t]=(tally[t]||0)+1); }
function unbump(tags){ tags.forEach(t=>{ if(tally[t]) tally[t]--; }); }
function pickTop(keys){ let best=null,n=-1; keys.forEach(k=>{ if((tally[k]||0)>n){n=tally[k]||0;best=k;} }); return best; }
function spectrum(l,r){ const L=tally[l]||0,R=tally[r]||0; if(L+R===0) return 50; return Math.round(R/(L+R)*100); }
function nm(s){ s = s||'';
  if(playerName && playerName!=='you') return s.split('{{NAME}}').join(playerName);
  return s.replace(/,\s*\{\{NAME\}\}/g,'').replace(/\{\{NAME\}\},\s*/g,'').split('{{NAME}}').join('you'); }

function renderIntro(){
  stage.innerHTML = `<div class="scene" style="text-align:center">
    <div class="ask" style="font-size:22px;margin-bottom:8px;color:var(--accent);font-family:Georgia,serif;">YOUR NEXT CHAPTER</div>
    <div class="narr" style="margin-bottom:10px;">You weren't looking for a new challenge.<br>But it found you anyway.</div>
    <div class="narr" style="font-size:13px;font-style:normal;color:var(--sub);font-family:Arial,sans-serif;margin-bottom:22px;">${flat.length} quick scenes, about 6 minutes.<br>No right or wrong answers. Just pick what feels most like you.</div>
    <input type="text" id="nameInput" class="nameinput" placeholder="What should we call you?" maxlength="24">
    <button class="cbtn" style="width:100%" onclick="startStory()">START YOUR DAY →</button>
    </div>`;
  document.getElementById('nameInput').focus();
}
function startStory(){
  const v = (document.getElementById('nameInput').value || '').trim();
  playerName = v || 'you';
  render();
}
function render(){
  const q = flat[idx];
  if(q.c && q.c !== lastChapterShown){ lastChapterShown=q.c; return renderChapterCard(q.c); }
  renderScene(q);
}
function renderChapterCard(cnum){
  const ch = CH[cnum-1];
  const prev = chapterLog[cnum-1];
  let recap = '';
  if(prev && prev.length){
    recap = `<div class="clue"><b>Previously:</b> ${prev.slice(0,3).join(' ')}</div>`;
  }
  stage.innerHTML = `<div class="title-card">
    <div class="time">${ch.w}</div>
    <div class="emoji">${ch.e}</div><div class="num">Chapter ${ch.n}</div>
    <h2>${ch.t}</h2><p>${nm(ch.s)}</p>
    ${recap}
    <button class="cbtn" onclick="dismissCard()">Continue</button></div>`;
}
function dismissCard(){ renderScene(flat[idx]); }
function renderScene(q){
  let dots=''; for(let i=0;i<CH.length;i++){ dots+=`<div class="dot2 ${i < (q.c||CH.length) ? 'done':''}"></div>`; }
  const letters=['A','B','C','D'];
  const canBack = history.length>0 && !usedBack.has(history[history.length-1].idx);
  stage.innerHTML = `<div class="scene"><div class="dots">${dots}</div><div class="count">${idx+1} / ${flat.length}</div>
    ${canBack ? `<button class="backbtn" onclick="goBack()">← Change my last answer</button>` : ''}
    <div class="narr">${nm(q.t)}</div><div class="ask">${nm(q.ask)}</div>
    ${q.o.map((o,i)=>`<button class="opt" onclick="choose(${i})"><b>${letters[i]}.</b>${o[0]}</button>`).join('')}
    </div>`;
}
function choose(i){
  const q = flat[idx];
  const opt = q.o[i];
  bump(opt[1]);
  const hasRecap = !!(q.c && opt[3]);
  if(hasRecap){ (chapterLog[q.c] = chapterLog[q.c]||[]).push(opt[3]); }
  history.push({idx:idx, tags:opt[1], chapter:q.c, rec:hasRecap});
  const txt = nm(opt[2]);
  stage.innerHTML = `<div class="scene reaction" style="cursor:pointer"><div class="narr">${txt}</div><div class="tapnote">tap to continue</div></div>`;
  idx++;
  let moved = false, tm = null;
  const go = ()=>{ if(moved) return; moved = true; clearTimeout(tm); if(idx>=flat.length) renderAspiration(); else render(); };
  tm = setTimeout(go, Math.min(3000, 700 + txt.split(' ').length*180));
  stage.firstChild.onclick = go;
}
function goBack(){
  if(history.length===0) return;
  const last = history[history.length-1];
  if(usedBack.has(last.idx)) return;
  unbump(last.tags);
  if(last.chapter && last.rec){ const log = chapterLog[last.chapter]; if(log && log.length) log.pop(); }
  usedBack.add(last.idx);
  history.pop();
  idx = last.idx;
  renderScene(flat[idx]);
}
function renderYearLater(){
  stage.innerHTML = `<div class="scene" style="text-align:center">
    <div class="time" style="color:var(--accent);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px;font-family:Arial,sans-serif;">Looking back</div>
    <div class="narr">${playerName!=='you' ? playerName+', y' : 'Y'}ou started this without knowing exactly where it would lead.<br><br>
    Some choices were about solving problems. Some were about people.<br>
    Some were about how you wanted to work — and who you wanted to become.</div>
    <button class="cbtn" style="width:100%" onclick="renderAspiration()">Continue →</button></div>`;
}
function renderAspiration(){
  statedThemes = [];
  stage.innerHTML = `<div class="scene"><div class="narr">${ASPIRE.t}</div><div class="ask">${ASPIRE.ask}</div>
   ${Object.keys(PATHS).map(k=>`<button class="opt theme" data-k="${k}" onclick="toggleTheme('${k}')"><b>•</b>${PATHS[k].theme}</button>`).join('')}
   <button class="opt theme" data-k="unsure" onclick="toggleTheme('unsure')"><b>•</b>I'm not sure yet</button>
   <button class="cbtn" id="themeGo" style="width:100%;margin-top:6px;opacity:.4" onclick="confirmThemes()">Continue →</button></div>`;
}
function toggleTheme(k){
  if(k==='unsure'){ statedThemes = statedThemes.includes('unsure') ? [] : ['unsure']; }
  else {
    statedThemes = statedThemes.filter(x=>x!=='unsure');
    if(statedThemes.includes(k)) statedThemes = statedThemes.filter(x=>x!==k);
    else { statedThemes.push(k); if(statedThemes.length>2) statedThemes.shift(); }
  }
  document.querySelectorAll('.opt.theme').forEach(el=>el.classList.toggle('sel', statedThemes.includes(el.dataset.k)));
  const go = document.getElementById('themeGo'); if(go) go.style.opacity = statedThemes.length ? 1 : .4;
}
function confirmThemes(){ if(statedThemes.length) renderSupport(); }
function renderSupport(){
  const letters=['A','B','C','D'];
  stage.innerHTML = `<div class="scene"><div class="ask">What would help you most to get there?</div>
   ${Object.keys(SUPPORT).map((k,i)=>`<button class="opt" onclick="chooseSupport('${k}')"><b>${letters[i]}.</b>${SUPPORT[k]}</button>`).join('')}</div>`;
}
function chooseSupport(k){ supportKey = k; renderResults(); }

function renderResults(){
  const energiseKey = pickTop(ENERGISE_TAGS) || 'Achievement';
  const whyKey = pickTop(WHY_TAGS) || 'Purpose';
  const carKey = pickTop(Object.keys(CAR)) || 'CarCrossFunctional';
  const learnKey = pickTop(Object.keys(LEARN)) || 'LearnExperiential';
  const envKey = pickTop(Object.keys(ENV)) || 'EnvAutonomous';
    const ts = thinkScores(), tsP = ts[0], tsS = ts[1], thinkBlend = (tsP.pct - tsS.pct) <= 10;
  const pathKey = pickPath(carKey), PATH = PATHS[pathKey];
  const carTot = Object.keys(CAR).reduce((s,k)=>s+(tally[k]||0),0) || 1;
  const carRows = Object.keys(CAR).map(k=>({k, n:tally[k]||0, pct:Math.round((tally[k]||0)/carTot*100)}));
  const carOrdered = [carRows.find(x=>x.k===carKey)].concat(carRows.filter(x=>x.k!==carKey).sort((x,y)=>y.n-x.n));
  const carSec = carOrdered[1] && carOrdered[1].n>0 ? carOrdered[1] : null;
  const carTier = (x,i)=> i===0 ? 'Strongest pull' : (x.pct>=20 ? 'Some pull' : 'Lighter pull');
  const thinkTier = (x,i)=> (i===0 || (thinkBlend && i===1)) ? 'Natural lean' : (x.pct>=25 ? 'Supporting' : 'Less natural');
  const stated = statedThemes.filter(k=>PATHS[k]);
  const lc = t=>t.charAt(0).toLowerCase()+t.slice(1);
  const statedNames = stated.map(k=>lc(PATHS[k].theme)).join(' and ');
  let statedNote;
  if(!stated.length) statedNote = "You weren't sure yet, which is a fine place to be. This profile gives you a starting point.";
  else if(stated.includes(pathKey)) statedNote = `You said you'd like to focus on ${statedNames}, and that lines up with where your choices pointed.`;
  else if(stated.some(k=>PATHS[k].parent===carKey)) statedNote = `You said you'd like to focus on ${statedNames}. That's the same direction as your choices, with a different focus.`;
  else statedNote = `You said you'd like to focus on ${statedNames}, which is different from where your choices leaned. Worth a conversation, not a conclusion.`;
  const extraPath = stated.find(k=>k!==pathKey);

  stage.innerHTML = `<div class="result">
  <h1>${playerName!=='you' ? playerName+"\u2019s" : 'Your'} Next Chapter Profile</h1>
  <div class="sub">Not a personality type — a pattern built from every decision you just made.</div>

  <div class="sec"><h3>🔥 Aspiration & Drive</h3>
   <p><b>${LABEL[energiseKey]}.</b> You're energised by ${DRIVER_PHRASE[energiseKey]}.</p></div>

  <div class="sec"><h3>💡 Your Why</h3>
   <p><b>${LABEL[whyKey]}.</b> What matters most to you: ${DRIVER_PHRASE[whyKey]}.</p></div>

  <div class="sec"><h3>🧗 Career Path Pull</h3>
   <p><b>${CAR[carKey].lbl}.</b> ${CAR[carKey].d}${carSec ? ` There's also a pull toward <b>${CAR[carSec.k].lbl}</b>.` : ''}</p>
   <div style="margin-top:10px">${carOrdered.map((x,i)=>`<div class="spec"><div class="lbl"><span>${CAR[x.k].lbl}</span><span>${carTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">Based on your career-related choices in the story.</p>
   <p style="margin-top:12px"><b>Closest growth direction: ${PATH.lbl}.</b> ${PATH.d}</p>
   <p class="note"><b>How this can happen at Aafiyat.</b> ${PATH.route}</p>
   <p class="note">${statedNote}</p></div>

  <div class="sec"><h3>🧭 Learning Style</h3>
   <p>${LEARN[learnKey]}</p></div>

  <div class="sec"><h3>🧠 How You Think</h3>
   <p>${thinkBlend ? `A blend of <b>${tsP.lbl}</b> and <b>${tsS.lbl}</b>.` : `<b>${tsP.lbl}</b>, with a supporting lean toward ${tsS.lbl}.`} ${THINK[tsP.k].d}${thinkBlend ? ' ' + THINK[tsS.k].d : ''}</p>
   <div style="margin-top:10px">${ts.map((x,i)=>`<div class="spec"><div class="lbl"><span>${x.lbl}</span><span>${thinkTier(x,i)}</span></div>
    <div class="track"><div class="fill" style="width:${Math.max(x.pct,3)}%;${i===0?'background:var(--accent)':''}"></div></div></div>`).join('')}</div>
   <p class="note">This shows what comes naturally to you, not what you're capable of. A lighter lean is a stretch area, or a chance to lean on teammates who think differently.</p></div>

  <div class="sec"><h3>⚙️ How You Naturally Work</h3>
   ${SPECTRA.map(s=>`<div class="spec"><div class="lbl"><span>${s.label[0]}</span><span>${s.label[1]}</span></div>
    <div class="track"><div class="dot" style="left:${spectrum(s.l,s.r)}%"></div></div></div>`).join('')}</div>

  <div class="sec"><h3>🚀 Where You Thrive</h3>
   <p>An environment with ${ENV[envKey]}</p></div>

  <div class="sec"><h3>🌱 Development Direction</h3>
   <p>To build toward <b>${PATH.lbl}</b>:</p>
   <ul>${PATH.dev.map(d=>`<li>${d}</li>`).join('')}</ul>
   ${extraPath ? `<p>For the area you picked (<b>${lc(PATHS[extraPath].theme)}</b>):</p><ul>${PATHS[extraPath].dev.map(d=>`<li>${d}</li>`).join('')}</ul>` : ''}
   <p><b>How you'd learn it best.</b> ${METHOD[learnKey]}</p>
   <p style="margin-top:8px"><b>Support that would help most.</b> ${SUPPORT[supportKey]}.</p>
   <p style="margin-top:8px"><b>Your growth edge (${tsP.lbl}).</b> ${EDGE[tsP.k]}</p>
   <p style="margin-top:8px"><b>A stretch for the next 6 months.</b> ${PATH.stretch}</p></div>

  <button class="admin-toggle" onclick="toggleAdmin()">🔒 Show L&D scoring view (admin)</button>
  <div class="admin hidden" id="adminPanel"></div>
  <button class="restart" onclick="restart()">Play again</button>
  </div>`;
}
function toggleAdmin(){
  const p = document.getElementById('adminPanel');
  p.classList.toggle('hidden');
  if(!p.innerHTML){
    const groups = [['Drivers/Values',Object.keys(DRIVER_PHRASE)],['Career pull',Object.keys(CAR)],['Learning',Object.keys(LEARN)],['Role directions',Object.keys(PATHS)],['Environment',Object.keys(ENV)]];
    let html=`<div style="margin-bottom:6px;">Stated focus (explicit): <b>${statedThemes.map(k=>k==='unsure'?'Not sure yet':PATHS[k].theme).join(' + ')}</b><br>Support wanted: <b>${SUPPORT[supportKey]}</b></div>`;
    html += `<div style="margin:10px 0 4px;font-weight:700;">Thinking style (picks / scenes where available)</div>`;
    thinkScores().forEach(x=>{
      html += `<div class="bar-row"><div class="bar-lbl"><span>${x.lbl}</span><span>${x.n}/${x.av} · ${x.pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${x.pct}%"></div></div></div>`;
    });
    groups.forEach(g=>{
      const max = Math.max(1, ...g[1].map(k=>tally[k]||0));
      html += `<div style="margin:10px 0 4px;font-weight:700;">${g[0]}</div>`;
      g[1].forEach(k=>{
        const n = tally[k]||0;
        html += `<div class="bar-row"><div class="bar-lbl"><span>${LABEL[k]||CAR[k]&&CAR[k].lbl||PATHS[k]&&PATHS[k].lbl||LEARN[k]||ENV[k]||k}</span><span>${n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div></div>`;
      });
    });
    p.innerHTML = html;
  }
}
function restart(){ idx=0; tally={}; statedThemes=[]; supportKey=null; lastChapterShown=0; playerName=""; chapterLog={}; history=[]; usedBack=new Set(); renderIntro(); }
renderIntro();
</script>
</body>
</html>
